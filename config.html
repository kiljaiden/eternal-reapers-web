<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --wow-gold: #c79c6e;
            --wow-dark: #0a0b0d;
            --wow-card: #15171e;
            --bnet-blue: #00aeff;
            /* Colores de Clase */
            --Warrior: #C79C6E; --Paladin: #F58CBA; --DeathKnight: #C41F3B; 
            --Hunter: #ABD473; --Rogue: #FFF569; --Priest: #FFFFFF; 
            --Shaman: #0070DE; --Mage: #69CCF0; --Warlock: #9482C9; --Druid: #FF7D0A;
        }

        body { 
            background: #050505; color: #f0f0f0; font-family: 'Roboto', sans-serif; 
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at top, #1a1d23 0%, #050505 100%);
        }

        .config-container { max-width: 900px; margin: 0 auto; }
        .header-config { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--wow-gold); padding-bottom: 15px;}
        .header-config h1 { font-family: 'Oswald'; color: var(--wow-gold); text-transform: uppercase; font-size: 2.5rem; margin: 0; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { 
            background: rgba(255,255,255,0.05); border: 1px solid #333; color: #888; padding: 12px 25px; 
            font-family: 'Oswald'; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .tab-btn.active { color: var(--wow-gold); border-color: var(--wow-gold); background: rgba(199,156,110,0.1); }

        .panel { display: none; animation: fadeIn 0.4s; }
        .panel.active { display: block; }

        .card { 
            background: var(--wow-card); padding: 30px; border: 1px solid #333; 
            border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 25px;
        }

        .section-title { 
            color: var(--wow-gold); font-family: 'Oswald'; border-bottom: 1px solid rgba(199,156,110,0.2); 
            padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase;
        }

        /* ICONO DINÁMICO AL SELECCIONAR CLASE */
        .class-preview {
            width: 50px; height: 50px; border: 1px solid var(--wow-gold);
            background-size: cover; border-radius: 4px; background-color: #000;
        }

        /* PERSONAJES REGISTRADOS */
        .pj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .pj-card { 
            background: #0d0e12; border-left: 5px solid #333; padding: 15px; 
            position: relative; transition: 0.3s;
        }
        .pj-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .pj-name { font-family: 'Oswald'; font-size: 1.3rem; }
        .btn-del { position: absolute; top: 10px; right: 10px; color: #555; cursor: pointer; border:none; background:none; }
        .btn-del:hover { color: #ff4444; }

        input, select { 
            width: 100%; padding: 12px; background: rgba(0,0,0,0.6); border: 1px solid #444; 
            color: white; border-radius: 4px; margin-bottom: 15px; box-sizing: border-box;
        }
        input:focus, select:focus { border-color: var(--bnet-blue); outline: none; }

        .btn-save { 
            background: linear-gradient(to bottom, #c79c6e 0%, #a67c52 100%); 
            border: none; color: black; font-weight: bold; padding: 12px 25px; 
            font-family: 'Oswald'; cursor: pointer; border-radius: 4px; text-transform: uppercase; width: 100%;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="config-container">
        <div class="header-config">
            <h1>Cámara de Configuración</h1>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-cuenta', this)">Seguridad y Cuenta</button>
            <button class="tab-btn" onclick="switchTab('tab-personajes', this)">Gestión de Héroes</button>
        </div>

        <div id="tab-cuenta" class="panel active">
            <div class="card">
                <div class="section-title">🔒 Seguridad de la Cuenta</div>
                <label>Nombre de Usuario</label>
                <input type="text" id="nombre-user" placeholder="Nombre visible...">
                
                <label>Correo Electrónico Actual</label>
                <input type="email" id="email-user" placeholder="nuevo-correo@ejemplo.com">
                
                <label>Nueva Contraseña</label>
                <input type="password" id="pass-user" placeholder="Mínimo 6 caracteres">
                
                <button class="btn-save" onclick="guardarCuenta()">Sellar Cambios</button>
            </div>
        </div>

        <div id="tab-personajes" class="panel">
            <div class="card">
                <div class="section-title">⚔️ Invocar Nuevo Personaje</div>
                <div style="display: flex; gap: 15px; align-items: flex-start;">
                    <div id="class-icon-display" class="class-preview"></div>
                    <div style="flex-grow: 1;">
                        <input type="text" id="pj-name" placeholder="Nombre del Personaje">
                        <select id="pj-class" onchange="updateSpecsAndIcon()">
                            <option value="">Selecciona Clase...</option>
                            <option value="Warrior">Guerrero</option>
                            <option value="Paladin">Paladín</option>
                            <option value="DeathKnight">DK</option>
                            <option value="Hunter">Cazador</option>
                            <option value="Rogue">Pícaro</option>
                            <option value="Priest">Sacerdote</option>
                            <option value="Shaman">Chamán</option>
                            <option value="Mage">Mago</option>
                            <option value="Warlock">Brujo</option>
                            <option value="Druid">Druida</option>
                        </select>
                        
                        <select id="pj-spec">
                            <option value="">Primero elige una clase...</option>
                        </select>
                        
                        <input type="number" id="pj-gs" step="0.1" placeholder="GearScore (Ej: 6.2)">
                        <button class="btn-save" onclick="addPJ()">Añadir a la Hermandad</button>
                    </div>
                </div>
            </div>

            <div class="section-title">📜 Tus Personajes Registrados</div>
            <div class="pj-grid" id="pj-lista">
                </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    <script>
        firebase.initializeApp({ databaseURL: "https://eternalreapersweb-default-rtdb.firebaseio.com" });
        const db = firebase.database();
        // Nota: Asegúrate de que esta ID sea la correcta según tu sistema de login
        const userId = "USER_TEST_ID"; 

        const ramas = {
            "Warrior": ["Armas", "Furia", "Protección"],
            "Paladin": ["Sagrado", "Protección", "Reprensión"],
            "DeathKnight": ["Sangre", "Escarcha", "Profano"],
            "Hunter": ["Bestias", "Puntería", "Supervivencia"],
            "Rogue": ["Asesinato", "Combate", "Sutileza"],
            "Priest": ["Disciplina", "Sagrado", "Sombras"],
            "Shaman": ["Elemental", "Mejora", "Restauración"],
            "Mage": ["Arcano", "Fuego", "Escarcha"],
            "Warlock": ["Aflicción", "Demonología", "Destrucción"],
            "Druid": ["Equilibrio", "Feral", "Restauración"]
        };

        const iconos = {
            "Warrior": "warrior", "Paladin": "paladin", "DeathKnight": "deathknight",
            "Hunter": "hunter", "Rogue": "rogue", "Priest": "priest",
            "Shaman": "shaman", "Mage": "mage", "Warlock": "warlock", "Druid": "druid"
        };

        function switchTab(tabId, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function updateSpecsAndIcon() {
            const clase = document.getElementById('pj-class').value;
            const specSelect = document.getElementById('pj-spec');
            const iconDiv = document.getElementById('class-icon-display');

            // Actualizar Icono
            if(iconos[clase]) {
                iconDiv.style.backgroundImage = `url('https://wow.zamimg.com/images/wow/icons/large/classicon_${iconos[clase].toLowerCase()}.jpg')`;
            } else {
                iconDiv.style.backgroundImage = 'none';
            }

            // Actualizar Especializaciones
            specSelect.innerHTML = '<option value="">Seleccionar Rama...</option>';
            if(ramas[clase]) {
                ramas[clase].forEach(s => {
                    specSelect.innerHTML += `<option value="${s}">${s}</option>`;
                });
            }
        }

        // CARGA DE PERSONAJES (Incluso los antiguos)
        function loadPJs() {
            db.ref('usuarios/' + userId + '/personajes').on('value', s => {
                const list = document.getElementById('pj-lista');
                list.innerHTML = '';
                if(!s.exists()) { list.innerHTML = '<p style="color:#666">No hay personajes registrados.</p>'; return; }
                
                s.forEach(ch => {
                    const p = ch.val();
                    const colorClase = `var(--${p.clase})`;
                    list.innerHTML += `
                        <div class="pj-card" style="border-left-color: ${colorClase}">
                            <button class="btn-del" onclick="borrarPJ('${ch.key}')">✖</button>
                            <div class="pj-name" style="color: ${colorClase}">${p.nombre}</div>
                            <div style="font-size:0.9rem; color:#ccc;">${p.clase} - ${p.spec || 'Sin Spec'}</div>
                            <div style="color:var(--wow-gold); font-weight:bold;">${p.gs || '0'} GS</div>
                        </div>`;
                });
            });
        }

        function addPJ() {
            const n = document.getElementById('pj-name').value;
            const c = document.getElementById('pj-class').value;
            const s = document.getElementById('pj-spec').value;
            const g = document.getElementById('pj-gs').value;

            if(!n || !c) return alert("El nombre y la clase son obligatorios.");

            db.ref('usuarios/' + userId + '/personajes').push({
                nombre: n, clase: c, spec: s, gs: g
            }).then(() => {
                document.getElementById('pj-name').value = '';
                document.getElementById('pj-gs').value = '';
            });
        }

        function borrarPJ(key) { if(confirm("¿Eliminar este personaje?")) db.ref('usuarios/'+userId+'/personajes/'+key).remove(); }

        function guardarCuenta() {
            const email = document.getElementById('email-user').value;
            const nom = document.getElementById('nombre-user').value;
            // Aquí iría la lógica de firebase.auth().updateEmail(email)
            alert("Perfil y correo actualizados en la base de datos.");
        }

        loadPJs();
    </script>
</body>
</html>
