<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bnet-blue: #00aeff; 
            --bnet-card: #1a1d23;
            --bnet-bg: #15171e;
            --bnet-hover: rgba(0, 174, 255, 0.1);
        }
        
        body { 
            background: var(--bnet-bg); 
            color: #f0f0f0; 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding: 0;
            overflow-x: hidden;
        }

        /* --- SLICE / CARRUSEL DESTACADO --- */
        .featured-slice {
            width: 100%;
            height: 350px;
            background: linear-gradient(to bottom, rgba(21, 23, 30, 0) 0%, rgba(21, 23, 30, 1) 100%), 
                        url('https://images.blz-contentstack.com/v3/assets/blt3452e3b114fab0cd/blt7695c02693751876/613666d999099949603097b6/king-of-the-hill.jpg'); /* Imagen de respaldo */
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            cursor: pointer;
            transition: 0.3s;
        }

        .featured-slice:hover { filter: brightness(1.1); }

        .featured-content {
            padding: 40px;
            max-width: 800px;
        }

        .featured-content .news-date {
            color: var(--bnet-blue);
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .featured-content h2 {
            font-family: 'Oswald';
            font-size: 2.5rem;
            margin: 10px 0;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* --- GRID DE NOTICIAS --- */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
        }

        .card {
            background: var(--bnet-card);
            border: 1px solid #2a2e35;
            border-radius: 4px;
            overflow: hidden;
            transition: 0.2s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--bnet-blue);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .card-img {
            width: 100%;
            height: 160px;
            background: #0e1014;
            background-image: linear-gradient(45deg, #1a1d23, #000);
        }

        .card-info { padding: 20px; }

        .card-info .news-date {
            font-size: 0.7rem;
            color: #888;
            display: block;
            margin-bottom: 5px;
        }

        .card-info h3 {
            margin: 0 0 10px 0;
            font-family: 'Oswald';
            font-size: 1.2rem;
            color: #fff;
        }

        .card-info p {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.4;
            height: 60px;
            overflow: hidden;
        }

        /* --- MODAL DE NOTICIA --- */
        .pop-news {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .pop-content {
            background: var(--bnet-card);
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            border-radius: 4px;
            position: relative;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .pop-header {
            height: 250px;
            background: var(--bnet-bg);
            background-size: cover;
            background-position: center;
        }

        .pop-body { padding: 30px; }

        .pop-body h2 { font-family: 'Oswald'; font-size: 2rem; margin-top: 0; color: var(--bnet-blue); }
        .pop-body p { line-height: 1.6; color: #ccc; white-space: pre-line; }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 2rem; color: #fff;
            cursor: pointer; z-index: 10;
        }

        .close-btn:hover { color: var(--bnet-blue); }

    </style>
</head>
<body>

    <div class="featured-slice" id="featured-slice">
        <div class="featured-content">
            <span class="news-date" id="feat-date">CARGANDO...</span>
            <h2 id="feat-title">ÚLTIMAS NOVEDADES</h2>
        </div>
    </div>

    <div class="news-grid" id="news-grid">
        </div>

    <div class="pop-news" id="pop-news">
        <div class="pop-content">
            <span class="close-btn" onclick="cerrar()">&times;</span>
            <div class="pop-header" id="pop-header"></div>
            <div class="pop-body">
                <span id="pop-date" style="color:var(--bnet-blue); font-size:0.8rem; font-weight:bold;"></span>
                <h2 id="pop-title"></h2>
                <p id="pop-body"></p>
            </div>
        </div>
    </div>

    <script>
        // La referencia 'db' debe estar inicializada en el index.html principal
        // o cargada aquí si se usa de forma independiente.
        
        const grid = document.getElementById('news-grid');

        db.ref('noticias').orderByChild('fecha').on('value', snapshot => {
            grid.innerHTML = '';
            let count = 0;
            const noticias = [];
            
            // Invertir para mostrar las más recientes primero
            snapshot.forEach(child => {
                noticias.unshift({ key: child.key, ...child.val() });
            });

            noticias.forEach(n => {
                const d = new Date(n.fecha).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });

                // La primera noticia se pone en el Slice destacado
                if(count === 0) {
                    document.getElementById('feat-title').innerText = n.titulo;
                    document.getElementById('feat-date').innerText = "DESTACADO | " + d;
                    document.getElementById('featured-slice').onclick = () => abrir(n.titulo, n.cuerpo, d);
                }

                grid.innerHTML += `
                    <div class="card" onclick="abrir('${n.titulo.replace(/'/g, "\\'")}', '${n.cuerpo.replace(/'/g, "\\'").replace(/\n/g, "\\n")}', '${d}')">
                        <div class="card-img"></div>
                        <div class="card-info">
                            <span class="news-date">${d}</span>
                            <h3>${n.titulo}</h3>
                            <p>${n.cuerpo.substring(0, 120)}...</p>
                        </div>
                    </div>`;
                count++;
            });
        });

        function abrir(t, b, d) {
            document.getElementById('pop-title').innerText = t;
            document.getElementById('pop-body').innerText = b;
            document.getElementById('pop-date').innerText = d;
            document.getElementById('pop-news').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Prevenir scroll del fondo
        }

        function cerrar() { 
            document.getElementById('pop-news').style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }

        // Cerrar modal al hacer click fuera del contenido
        window.onclick = (event) => {
            if (event.target == document.getElementById('pop-news')) cerrar();
        }
    </script>
</body>
</html>
