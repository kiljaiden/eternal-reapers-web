<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bnet-blue: #00aeff; 
            --bnet-card: #1a1d23;
            --bnet-bg: #15171e;
            --bnet-hover: rgba(0, 174, 255, 0.1);
        }
        
        body { 
            background: var(--bnet-bg); 
            color: #f0f0f0; 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding: 0;
            overflow-x: hidden;
        }

        /* --- SLICE / CARRUSEL DESTACADO --- */
        .featured-slice {
            width: 100%;
            height: 350px;
            background: linear-gradient(to bottom, rgba(21, 23, 30, 0) 0%, rgba(21, 23, 30, 1) 100%), url('https://images.blz-contentstack.com/v3/assets/blt3452e3b114fab0cd/blt7695c026938a9561/6169d300062a4d6501729c69/wrath-classic-bg.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            box-sizing: border-box;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }

        .featured-content {
            max-width: 800px;
        }

        .featured-content h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* --- GRID DE NOTICIAS --- */
        .news-container { padding: 0 40px 40px 40px; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 25px; 
        }

        .card { 
            background: var(--bnet-card); 
            border: 1px solid #2a2e35;
            border-radius: 4px;
            cursor: pointer; 
            transition: all 0.2s ease-in-out;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card:hover { 
            border-color: var(--bnet-blue);
            transform: translateY(-5px);
            background: var(--bnet-hover);
        }

        .card-img {
            height: 180px;
            background: #000 url('https://images.blz-contentstack.com/v3/assets/blt3452e3b114fab0cd/blt87463f683e95964a/627c244b7d59104b281f6233/world-of-warcraft-bg.jpg');
            background-size: cover;
            background-position: center;
        }

        .card-info { padding: 20px; }

        .news-date { 
            font-size: 0.75rem; 
            color: var(--bnet-blue); 
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px; 
            display: block; 
        }

        h3 { 
            margin: 0 0 10px 0; 
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            line-height: 1.2;
        }

        .card-info p {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.5;
            margin: 0;
        }

        /* --- MODAL DE NOTICIA AMPLIADA --- */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            backdrop-filter: blur(10px);
        }

        .modal-content { 
            background: var(--bnet-bg); 
            width: 90%; 
            max-width: 900px; 
            max-height: 85vh;
            border-radius: 8px;
            border: 1px solid #333; 
            position: relative; 
            overflow-y: auto;
            animation: openIn 0.3s ease-out;
        }

        @keyframes openIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header-img {
            width: 100%;
            height: 300px;
            background-size: cover;
            background-position: center;
        }

        .modal-body { padding: 40px; }

        .close { 
            position: fixed; 
            top: 20px; right: 30px; 
            cursor: pointer; 
            font-size: 2.5rem; 
            color: white;
            z-index: 1100;
        }

        .modal-body h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            color: var(--bnet-blue);
        }

        .modal-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #ddd;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="featured-slice" id="featured-slice">
        <div class="featured-content">
            <span class="news-date" id="feat-date">CARGANDO...</span>
            <h2 id="feat-title">BIENVENIDO A ETERNAL REAPERS</h2>
        </div>
    </div>

    <div class="news-container">
        <div id="news-grid" class="grid">Cargando noticias...</div>
    </div>

    <div id="pop-news" class="modal">
        <span class="close" onclick="cerrar()">×</span>
        <div class="modal-content">
            <div class="modal-header-img" id="pop-img"></div>
            <div class="modal-body">
                <span id="pop-date" class="news-date"></span>
                <h2 id="pop-title"></h2>
                <div id="pop-body" class="modal-text"></div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://eternalreapersweb-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Escuchar los cambios en la rama 'noticias'
db.ref('noticias').on('value', snapshot => {
    const grid = document.getElementById('news-grid'); // Asegúrate de que este ID exista en tu HTML
    grid.innerHTML = ''; // Limpiar el grid para recargar las noticias
    
    let noticiasArray = [];
    snapshot.forEach(child => {
        noticiasArray.push(child.val());
    });

    // Ordenar por fecha (más reciente primero)
    noticiasArray.reverse();

    noticiasArray.forEach((n, index) => {
        const fechaObj = new Date(n.fecha);
        const fechaFormateada = fechaObj.toLocaleDateString();

        // Lógica para la noticia destacada (la primera del array)
        if(index === 0) {
            const featTitle = document.getElementById('feat-title');
            const featDate = document.getElementById('feat-date');
            const featSlice = document.getElementById('featured-slice');
            
            if(featTitle) featTitle.innerText = n.titulo;
            if(featDate) featDate.innerText = "DESTACADO | " + fechaFormateada;
            if(featSlice) featSlice.onclick = () => abrir(n.titulo, n.cuerpo, fechaFormateada);
        }

        // Renderizar en el grid general
        grid.innerHTML += `
            <div class="card" onclick="abrir('${n.titulo.replace(/'/g, "\\'")}', '${n.cuerpo.replace(/'/g, "\\'").replace(/\n/g, "<br>")}', '${fechaFormateada}')">
                <div class="card-img"></div>
                <div class="card-info">
                    <span class="news-date">${fechaFormateada}</span>
                    <h3>${n.titulo}</h3>
                    <p>${n.cuerpo.substring(0, 100)}...</p>
                </div>
            </div>`;
    });
});

        function abrir(t, b, d) {
            document.getElementById('pop-title').innerText = t;
            document.getElementById('pop-body').innerText = b;
            document.getElementById('pop-date').innerText = d;
            document.getElementById('pop-news').style.display = 'flex';
            // Prevenir scroll del fondo
            document.body.style.overflow = 'hidden';
        }

        function cerrar() { 
            document.getElementById('pop-news').style.display = 'none'; 
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
