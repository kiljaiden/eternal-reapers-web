<div class="module-header" style="margin-bottom: 30px;">
    <h2 style="font-family: 'Oswald'; color: var(--accent-color); margin-top: 0; text-transform: uppercase; letter-spacing: 2px;">
        Actualizar Usuarios
    </h2>
    <p style="color: #666; font-size: 0.9rem;">
        Gestiona los rangos de acceso para los miembros de la hermandad en la base de datos.
    </p>
</div>

<div style="background: rgba(26, 29, 35, 0.8); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden;">
    <table style="width: 100%; border-collapse: collapse; text-align: left; font-family: 'Roboto';">
        <thead>
            <tr style="background: rgba(0,0,0,0.4); color: var(--accent-color); font-family: 'Oswald'; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;">
                <th style="padding: 15px; border-bottom: 2px solid #222;">Usuario / Email</th>
                <th style="padding: 15px; border-bottom: 2px solid #222;">Rango Actual</th>
                <th style="padding: 15px; border-bottom: 2px solid #222; text-align: center;">Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-usuarios-body" style="color: #eee; font-size: 0.9rem;">
            <tr>
                <td colspan="3" style="padding: 30px; text-align: center; color: #444; font-family: 'Oswald';">
                    CONECTANDO CON EL ARCHIVO DE ALMAS...
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    (function() {
        const tableBody = document.getElementById('tabla-usuarios-body');

        // Escuchar cambios en la rama 'usuarios' de Firebase
        db.ref('usuarios').on('value', snapshot => {
            tableBody.innerHTML = '';
            
            if (!snapshot.exists()) {
                tableBody.innerHTML = '<tr><td colspan="3" style="padding:20px; text-align:center;">No hay usuarios registrados.</td></tr>';
                return;
            }

            snapshot.forEach(child => {
                const user = child.val();
                const uid = child.key;
                
                const tr = document.createElement('tr');
                tr.style.borderBottom = "1px solid rgba(255,255,255,0.02)";
                tr.style.transition = "0.2s";
                
                // Efecto hover en la fila
                tr.onmouseover = () => tr.style.background = "rgba(255,255,255,0.02)";
                tr.onmouseout = () => tr.style.background = "transparent";

                tr.innerHTML = `
                    <td style="padding: 15px;">
                        <div style="font-weight: bold; color: #fff;">${user.nombre || 'Sin nombre'}</div>
                        <div style="font-size: 0.75rem; color: #555;">${user.email || 'Sin email'}</div>
                    </td>
                    <td style="padding: 15px;">
                        <select onchange="actualizarRango('${uid}', this.value)" 
                            style="background: #050505; color: #ccc; border: 1px solid #333; padding: 6px 10px; border-radius: 4px; font-family: 'Oswald'; outline: none; cursor: pointer; text-transform: uppercase; font-size: 0.8rem;">
                            <option value="aspirante" ${user.rango === 'aspirante' ? 'selected' : ''}>Aspirante</option>
                            <option value="oficial" ${user.rango === 'oficial' ? 'selected' : ''}>Oficial</option>
                            <option value="admin" ${user.rango === 'admin' ? 'selected' : ''}>Admin</option>
                        </select>
                    </td>
                    <td style="padding: 15px; text-align: center;">
                        <button onclick="eliminarCuenta('${uid}', '${user.nombre}')" 
                            style="background: transparent; border: 1px solid #dc3545; color: #dc3545; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: 'Oswald'; font-size: 0.7rem; text-transform: uppercase; transition: 0.2s;">
                            Eliminar
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        });

        // Función para cambiar el rango
        window.actualizarRango = function(uid, nuevoRango) {
            db.ref('usuarios/' + uid).update({
                rango: nuevoRango
            }).then(() => {
                console.log(`Rango de ${uid} actualizado a ${nuevoRango}`);
            }).catch(err => {
                alert("Error al actualizar: " + err.message);
            });
        };

        // Función para eliminar usuario (solo de la base de datos)
        window.eliminarCuenta = function(uid, nombre) {
            if (confirm(`¿Estás totalmente seguro de eliminar a ${nombre}? Perderá todos sus accesos.`)) {
                db.ref('usuarios/' + uid).remove();
            }
        };
    })();
</script>
