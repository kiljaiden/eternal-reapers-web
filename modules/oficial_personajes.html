<div class="module-header" style="margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end;">
    <div>
        <h2 style="font-family: 'Oswald'; color: var(--accent-color); margin-top: 0; text-transform: uppercase; letter-spacing: 2px;">Directorio de Miembros</h2>
        <p style="color: #666; font-size: 0.9rem;">Asigna personajes a Cores específicas o gestiónalos en la banca.</p>
    </div>
    <div style="background: rgba(0, 174, 255, 0.1); border: 1px solid var(--accent-color); padding: 10px 20px; border-radius: 4px; text-align: center;">
        <div style="font-size: 0.7rem; color: var(--accent-color); font-weight: bold; text-transform: uppercase;">Total Personajes</div>
        <div id="total-pjs-count" style="font-family: 'Oswald'; font-size: 1.5rem; color: #fff;">0</div>
    </div>
</div>

<div style="margin-bottom: 20px; display: flex; gap: 10px;">
    <input type="text" id="search-pj" placeholder="Buscar por nombre de personaje o usuario..." 
        style="flex: 1; background: #050505; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; font-family: 'Roboto';">
</div>

<div id="miembros-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
    </div>

<script>
    (function() {
        const grid = document.getElementById('miembros-grid');
        const counter = document.getElementById('total-pjs-count');
        const searchInput = document.getElementById('search-pj');

        // Colores por Rango de Core
        const coreColors = {
            'Core 1': '#ffcc00', 'Core 2': '#00ffcc', 'Core 3': '#cc00ff',
            'Core 4': '#ff6600', 'Banca': '#666666', 'Sin Asignar': '#444'
        };

        db.ref('usuarios').on('value', snapshot => {
            grid.innerHTML = '';
            let totalPjs = 0;
            const searchTerm = searchInput.value.toLowerCase();

            snapshot.forEach(uChild => {
                const user = uChild.val();
                const userId = uChild.key;
                
                if (user.personajes) {
                    Object.entries(user.personajes).forEach(([pjKey, pj]) => {
                        totalPjs++;

                        // Filtro de búsqueda
                        if (searchTerm && !pj.nombre.toLowerCase().includes(searchTerm) && !user.nombre.toLowerCase().includes(searchTerm)) {
                            return;
                        }

                        const currentCore = pj.core || 'Sin Asignar';
                        const card = document.createElement('div');
                        card.style.cssText = "background: rgba(26, 29, 35, 0.8); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 4px; display: flex; flex-direction: column; justify-content: space-between;";
                        
                        card.innerHTML = `
                            <div style="margin-bottom: 10px;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="font-family: 'Oswald'; font-size: 1.1rem; color: #fff;">${pj.nombre}</span>
                                    <span style="font-size: 0.65rem; background: ${coreColors[currentCore]}; color: #000; padding: 2px 6px; border-radius: 2px; font-weight: bold; text-transform: uppercase;">${currentCore}</span>
                                </div>
                                <div style="font-size: 0.8rem; color: #666; margin-top: 2px;">Usuario: ${user.nombre}</div>
                                <div style="font-size: 0.85rem; color: #aaa; margin-top: 8px;">${pj.clase} - ${pj.spec}</div>
                                <div style="font-size: 0.9rem; color: var(--accent-color); font-weight: bold;">${pj.gs} GS</div>
                            </div>

                            <div style="border-top: 1px solid #222; padding-top: 12px; margin-top: 10px;">
                                <label style="display:block; font-size: 0.6rem; color: #444; text-transform: uppercase; margin-bottom: 5px; font-weight: bold;">Asignar Core:</label>
                                <select onchange="asignarCore('${userId}', '${pjKey}', this.value)" 
                                    style="width: 100%; background: #050505; border: 1px solid #333; color: #eee; padding: 5px; border-radius: 4px; font-family: 'Oswald'; font-size: 0.8rem; cursor: pointer;">
                                    <option value="Sin Asignar" ${currentCore === 'Sin Asignar' ? 'selected' : ''}>--- SELECCIONAR ---</option>
                                    <option value="Core 1" ${currentCore === 'Core 1' ? 'selected' : ''}>CORE 1</option>
                                    <option value="Core 2" ${currentCore === 'Core 2' ? 'selected' : ''}>CORE 2</option>
                                    <option value="Core 3" ${currentCore === 'Core 3' ? 'selected' : ''}>CORE 3</option>
                                    <option value="Core 4" ${currentCore === 'Core 4' ? 'selected' : ''}>CORE 4</option>
                                    <option value="Banca" ${currentCore === 'Banca' ? 'selected' : ''}>BANCA</option>
                                </select>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }
            });
            counter.innerText = totalPjs;
        });

        // Función para actualizar la Core en Firebase
        window.asignarCore = function(uid, pjk, coreValue) {
            db.ref('usuarios/' + uid + '/personajes/' + pjk).update({
                core: coreValue
            }).then(() => {
                console.log("Core actualizada");
            });
        };

        // Evento de búsqueda
        searchInput.addEventListener('input', () => {
            db.ref('usuarios').once('value', () => {}); // Forzar refresco visual
        });

    })();
</script>
