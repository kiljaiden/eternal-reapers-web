<div class="module-header" style="margin-bottom: 25px;">
    <h2 style="font-family: 'Oswald'; color: var(--accent-color); margin-top: 0; text-transform: uppercase; letter-spacing: 2px;">Crear Noticia</h2>
    <p style="color: #666; font-size: 0.9rem;">Publica anuncios con formato enriquecido, imágenes y videos.</p>
</div>

<div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px;">
    
    <div style="background: rgba(26, 29, 35, 0.8); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 4px;">
        
        <input type="text" id="news-title" placeholder="Título de la noticia..." 
            style="width: 100%; background: #050505; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 4px; margin-bottom: 15px; font-family: 'Oswald'; font-size: 1.1rem; box-sizing: border-box;">

        <div style="background: #111; border: 1px solid #333; padding: 8px; border-radius: 4px 4px 0 0; display: flex; gap: 8px; flex-wrap: wrap;">
            <button onclick="execCmd('bold')" style="background:#222; color:#fff; border:1px solid #444; padding:5px 10px; cursor:pointer;"><b>B</b></button>
            <input type="color" onchange="execCmd('foreColor', this.value)" style="height:30px; width:30px; background:none; border:none; cursor:pointer;">
            <button onclick="execCmd('createLink', prompt('URL del enlace:'))" style="background:#222; color:#fff; border:1px solid #444; padding:5px 10px; cursor:pointer;">🔗</button>
            <label style="background:var(--accent-color); color:#000; padding:5px 10px; cursor:pointer; font-size:0.8rem; font-weight:bold; border-radius:2px;">
                Cargar Multimedia
                <input type="file" id="media-upload" accept="image/*,video/webm" style="display:none" onchange="handleMedia(this)">
            </label>
        </div>

        <div id="editor" contenteditable="true" 
            style="min-height: 250px; background: #050505; border: 1px solid #333; border-top:none; color: #ccc; padding: 15px; border-radius: 0 0 4px 4px; overflow-y: auto; font-family: 'Roboto'; line-height: 1.6; outline: none;">
        </div>

        <button onclick="publicarNoticia()" style="width: 100%; background: var(--accent-color); color: #000; border: none; padding: 15px; font-family: 'Oswald'; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 20px; text-transform: uppercase;">
            Publicar Ahora
        </button>
    </div>

    <div>
        <h3 style="font-family: 'Oswald'; color: #555; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 15px;">Noticias Publicadas</h3>
        <div id="lista-noticias-admin" style="max-height: 500px; overflow-y: auto;">
            </div>
    </div>
</div>

<script>
    (function() {
        // IMPORTANTE: Aseguramos que use la base de datos del archivo padre
        const database = window.db || firebase.database();
        const editor = document.getElementById('editor');
        const tIn = document.getElementById('news-title');

        window.execCmd = (cmd, val = null) => {
            document.execCommand(cmd, false, val);
            editor.focus();
        };

        window.handleMedia = function(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = e.target.result;
                let htmlTag = file.type.includes('video') 
                    ? `<video src="${data}" controls style="max-width:100%; border-radius:4px;"></video>` 
                    : `<img src="${data}" style="max-width:100%; border-radius:4px;">`;
                document.execCommand('insertHTML', false, htmlTag + '<br>');
            };
            reader.readAsDataURL(file);
        };

        window.publicarNoticia = function() {
            const titulo = tIn.value;
            const cuerpo = editor.innerHTML;

            if(!titulo || editor.innerText.trim().length < 5) {
                alert("Por favor, rellena el título y el contenido.");
                return;
            }

            // Publicamos en la rama 'noticias' que es la que lee noticias.html
            database.ref('noticias').push({
                titulo: titulo,
                cuerpo: cuerpo,
                fecha: new Date().toISOString()
            }).then(() => {
                alert("Noticia subida correctamente.");
                tIn.value = "";
                editor.innerHTML = "";
                
                // Registro opcional en logs
                database.ref('logs').push({
                    usuario: firebase.auth().currentUser.email,
                    accion: "publicó la noticia: " + titulo,
                    tipo: "Noticia",
                    fecha: new Date().toISOString()
                });
            }).catch(err => alert("Error de Firebase: " + err.message));
        };

        // Cargar lista para poder borrar
        database.ref('noticias').on('value', s => {
            const list = document.getElementById('lista-noticias-admin');
            list.innerHTML = '';
            s.forEach(ch => {
                const n = ch.val();
                list.innerHTML += `
                    <div style="background:rgba(0,0,0,0.3); padding:10px; border-radius:4px; margin-bottom:10px; display:flex; justify-content:space-between;">
                        <span style="font-family:'Oswald'; font-size:0.8rem; color:#fff;">${n.titulo}</span>
                        <button onclick="eliminarNoticia('${ch.key}')" style="background:none; border:none; color:red; cursor:pointer;">&times;</button>
                    </div>`;
            });
        });

        window.eliminarNoticia = (key) => {
            if(confirm("¿Borrar noticia?")) database.ref('noticias/' + key).remove();
        };
    })();
</script>
