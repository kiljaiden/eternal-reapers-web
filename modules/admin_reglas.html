<div class="module-header" style="margin-bottom: 25px;">
    <h2 style="font-family: 'Oswald'; color: var(--accent-color); margin-top: 0; text-transform: uppercase; letter-spacing: 2px;">Crear Regla de Hermandad</h2>
    <p style="color: #666; font-size: 0.9rem;">Define las normas de convivencia, loot y asistencia. Soporta enlaces de Wowhead.</p>
</div>

<div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px;">
    
    <div style="background: rgba(26, 29, 35, 0.8); border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 4px;">
        
        <input type="hidden" id="edit-key-regla"> <div style="margin-bottom: 15px;">
            <label style="display:block; font-size: 0.7rem; color: var(--accent-color); margin-bottom: 5px; font-weight: bold; text-transform: uppercase;">Título de la Regla</label>
            <input type="text" id="regla-titulo" placeholder="Ej: Regla 01: Sistema de Loot" 
                style="width: 100%; background: #050505; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 4px; font-family: 'Oswald'; box-sizing: border-box;">
        </div>

        <div style="background: #111; border: 1px solid #333; padding: 8px; border-radius: 4px 4px 0 0; display: flex; gap: 8px;">
            <button onclick="execRegla('bold')" title="Negrita" style="background:#222; color:#fff; border:1px solid #444; padding:5px 10px; cursor:pointer;"><b>B</b></button>
            <select onchange="execRegla('fontSize', this.value)" style="background:#222; color:#fff; border:1px solid #444; padding:5px;">
                <option value="3">Tamaño</option>
                <option value="2">Pequeño</option>
                <option value="3">Normal</option>
                <option value="5">Grande</option>
            </select>
            <input type="color" onchange="execRegla('foreColor', this.value)" title="Color" style="height:30px; width:30px; background:none; border:none; cursor:pointer;">
            <button onclick="execRegla('createLink', prompt('URL del objeto o enlace:'))" title="Insertar Link/Item" style="background:#222; color:#fff; border:1px solid #444; padding:5px 10px; cursor:pointer;">🔗</button>
        </div>

        <div id="regla-editor" contenteditable="true" 
            style="min-height: 200px; background: #050505; border: 1px solid #333; border-top:none; color: #ccc; padding: 15px; border-radius: 0 0 4px 4px; overflow-y: auto; font-family: 'Roboto'; line-height: 1.6; outline: none;">
        </div>

        <button id="btn-guardar-regla" onclick="guardarRegla()" style="width: 100%; background: var(--accent-color); color: #000; border: none; padding: 15px; font-family: 'Oswald'; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;">
            Publicar Regla
        </button>
        <button id="btn-cancelar-edit" onclick="resetFormRegla()" style="display:none; width: 100%; background: transparent; color: #666; border: 1px solid #333; padding: 10px; font-family: 'Oswald'; cursor: pointer; border-radius: 4px; margin-top: 10px; text-transform: uppercase;">
            Cancelar Edición
        </button>
    </div>

    <div>
        <h3 style="font-family: 'Oswald'; color: #555; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px;">Reglamento Actual</h3>
        <div id="lista-reglas-admin" style="max-height: 500px; overflow-y: auto; padding-right: 5px;">
            </div>
    </div>
</div>

<script>
    (function() {
        const editor = document.getElementById('regla-editor');
        const tIn = document.getElementById('regla-titulo');
        const editKey = document.getElementById('edit-key-regla');
        const btnSave = document.getElementById('btn-guardar-regla');
        const btnCancel = document.getElementById('btn-cancelar-edit');

        window.execRegla = (cmd, val = null) => {
            document.execCommand(cmd, false, val);
            editor.focus();
        };

        // GUARDAR O ACTUALIZAR
        window.guardarRegla = function() {
            const titulo = tIn.value;
            const cuerpo = editor.innerHTML;
            const key = editKey.value;

            if(!titulo || editor.innerText.trim().length < 5) return alert("Completa el título y contenido.");

            const data = { titulo, cuerpo };

            if(key) {
                // ACTUALIZAR
                db.ref('reglas_db/' + key).update(data).then(() => {
                    alert("Regla actualizada");
                    resetFormRegla();
                });
            } else {
                // CREAR NUEVA
                db.ref('reglas_db').push(data).then(() => {
                    alert("Regla publicada");
                    resetFormRegla();
                });
            }
        };

        // CARGAR LISTA
        db.ref('reglas_db').on('value', s => {
            const list = document.getElementById('lista-reglas-admin');
            list.innerHTML = '';
            s.forEach(ch => {
                const r = ch.val();
                const k = ch.key;
                const item = document.createElement('div');
                item.style.cssText = "background: rgba(0,0,0,0.3); border: 1px solid #222; padding: 12px; border-radius: 4px; margin-bottom: 10px;";
                item.innerHTML = `
                    <div style="font-family: 'Oswald'; color: #fff; font-size: 0.9rem; margin-bottom: 5px;">${r.titulo}</div>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="prepararEdicion('${k}')" style="background:none; border:none; color:var(--accent-color); cursor:pointer; font-size:0.7rem; font-weight:bold; text-transform:uppercase; padding:0;">Editar</button>
                        <button onclick="eliminarRegla('${k}')" style="background:none; border:none; color:#dc3545; cursor:pointer; font-size:0.7rem; font-weight:bold; text-transform:uppercase; padding:0;">Eliminar</button>
                    </div>
                `;
                list.appendChild(item);
            });
        });

        window.prepararEdicion = (k) => {
            db.ref('reglas_db/' + k).once('value', s => {
                const r = s.val();
                tIn.value = r.titulo;
                editor.innerHTML = r.cuerpo;
                editKey.value = k;
                btnSave.innerText = "Actualizar Cambios";
                btnCancel.style.display = "block";
                tIn.focus();
            });
        };

        window.resetFormRegla = () => {
            tIn.value = "";
            editor.innerHTML = "";
            editKey.value = "";
            btnSave.innerText = "Publicar Regla";
            btnCancel.style.display = "none";
        };

        window.eliminarRegla = (k) => {
            if(confirm("¿Seguro que quieres borrar esta regla? Se quitará de la página pública.")) {
                db.ref('reglas_db/' + k).remove();
            }
        };
    })();
</script>
