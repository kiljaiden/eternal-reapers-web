<div class="module-header" style="margin-bottom: 25px;">
    <h2 style="font-family: 'Oswald'; color: var(--accent-color); margin-top: 0; text-transform: uppercase; letter-spacing: 2px;">Registros del Sistema</h2>
    <p style="color: #666; font-size: 0.9rem;">Historial detallado de cambios de rango, publicaciones y actividad administrativa.</p>
</div>

<div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
    <button onclick="filtrarLogs('todos')" class="btn-filter active">Todos</button>
    <button onclick="filtrarLogs('Rango')" class="btn-filter">Rangos</button>
    <button onclick="filtrarLogs('Noticia')" class="btn-filter">Noticias</button>
    <button onclick="filtrarLogs('Regla')" class="btn-filter">Reglas</button>
    <button onclick="filtrarLogs('Raid')" class="btn-filter">Raids</button>
</div>

<div class="admin-card" style="background: rgba(26, 29, 35, 0.8); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden;">
    <div id="log-container" style="max-height: 600px; overflow-y: auto; font-family: 'Roboto';">
        <div style="padding: 40px; text-align: center; color: #444; font-family: 'Oswald';">CONSULTANDO HISTORIAL DE ACCIONES...</div>
    </div>
</div>

<style>
    .btn-filter {
        background: rgba(255,255,255,0.05); border: 1px solid #333; color: #888;
        padding: 8px 15px; border-radius: 4px; cursor: pointer; font-family: 'Oswald';
        text-transform: uppercase; font-size: 0.75rem; transition: 0.2s;
    }
    .btn-filter:hover { border-color: var(--accent-color); color: #fff; }
    .btn-filter.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); }

    .log-entry {
        padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.02);
        display: grid; grid-template-columns: 140px 1fr 100px; align-items: center; gap: 15px;
    }
    .log-entry:hover { background: rgba(255,255,255,0.01); }
    .log-date { font-size: 0.75rem; color: #444; font-family: 'Courier New'; }
    .log-msg { font-size: 0.85rem; color: #aaa; }
    .log-msg b { color: #eee; }
    .log-tag { 
        font-size: 0.6rem; padding: 2px 6px; border-radius: 2px; text-align: center; 
        font-weight: bold; text-transform: uppercase; 
    }
</style>

<script>
    (function() {
        const logBox = document.getElementById('log-container');
        let currentFilter = 'todos';

        // Mapeo de colores por tipo de acción
        const tagStyles = {
            'Rango': { bg: 'rgba(0, 174, 255, 0.2)', text: '#00aeff' },
            'Noticia': { bg: 'rgba(40, 167, 69, 0.2)', text: '#28a745' },
            'Regla': { bg: 'rgba(255, 193, 7, 0.2)', text: '#ffc107' },
            'Raid': { bg: 'rgba(220, 53, 69, 0.2)', text: '#dc3545' },
            'Sistema': { bg: 'rgba(255, 255, 255, 0.1)', text: '#888' }
        };

        window.filtrarLogs = function(tipo) {
            currentFilter = tipo;
            document.querySelectorAll('.btn-filter').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === tipo.toLowerCase() || (tipo === 'todos' && btn.innerText === 'Todos')) {
                    btn.classList.add('active');
                }
            });
            renderLogs();
        };

        function renderLogs() {
            db.ref('logs').limitToLast(100).on('value', snapshot => {
                logBox.innerHTML = '';
                if(!snapshot.exists()) {
                    logBox.innerHTML = '<div style="padding:40px; text-align:center; color:#555;">No hay registros en la base de datos.</div>';
                    return;
                }

                let logsArray = [];
                snapshot.forEach(child => {
                    logsArray.push(child.val());
                });

                // Ordenar por fecha (más reciente arriba)
                logsArray.reverse().forEach(log => {
                    const tipo = log.tipo || 'Sistema';
                    
                    // Aplicar filtro
                    if(currentFilter !== 'todos' && tipo !== currentFilter) return;

                    const style = tagStyles[tipo] || tagStyles['Sistema'];
                    const dateObj = new Date(log.fecha);
                    const dateStr = dateObj.toLocaleDateString() + ' ' + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                    const div = document.createElement('div');
                    div.className = 'log-entry';
                    div.innerHTML = `
                        <div class="log-date">${dateStr}</div>
                        <div class="log-msg"><b>${log.usuario}</b> ${log.accion}</div>
                        <div class="log-tag" style="background:${style.bg}; color:${style.text};">${tipo}</div>
                    `;
                    logBox.appendChild(div);
                });
            });
        }

        // Ejecutar al cargar
        renderLogs();
    })();
</script>
