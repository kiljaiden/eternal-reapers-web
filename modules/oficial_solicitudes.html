<div class="module-header" style="margin-bottom: 30px;">
    <h2 style="font-family: 'Oswald'; color: var(--accent-color); margin-top: 0; text-transform: uppercase; letter-spacing: 2px; font-weight: 700;">
        Revisión de Aspirantes
    </h2>
    <p style="color: #666; font-size: 0.9rem; font-family: 'Roboto';">
        Lista de personajes que desean pertenecer a la hermandad. Evalúa sus estadísticas y mensaje antes de aprobar.
    </p>
</div>

<div id="contenedor-solicitudes" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px;">
    <div style="color: #444; font-family: 'Oswald'; padding: 20px;">Sincronizando con el registro de aspirantes...</div>
</div>

<script>
    (function() {
        const container = document.getElementById('contenedor-solicitudes');
        
        // Colores de clase oficiales de WoW para el filtrado visual
        const classColors = {
            'Guerrero': '#C79C6E', 'Paladín': '#F58CBA', 'Cazador': '#ABD473',
            'Pícaro': '#FFF569', 'Sacerdote': '#FFFFFF', 'Chamán': '#0070DE',
            'Mago': '#69CCF0', 'Brujo': '#9482C9', 'Druida': '#FF7D0A', 
            'Caballero de la Muerte': '#C41F3B'
        };

        // Escuchar la rama 'solicitudes' en Firebase
        db.ref('solicitudes').on('value', snapshot => {
            container.innerHTML = '';
            
            if(!snapshot.exists()) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px dashed #222;">
                        <p style="color:#444; font-family:'Oswald'; font-size: 1.2rem; letter-spacing:1px;">NO HAY ASPIRANTES EN ESPERA</p>
                    </div>`;
                return;
            }

            snapshot.forEach(child => {
                const s = child.val();
                const key = child.key;
                const color = classColors[s.clase] || '#fff';

                const card = document.createElement('div');
                card.style.cssText = `
                    background: rgba(26, 29, 35, 0.85); 
                    border: 1px solid rgba(255,255,255,0.05); 
                    border-radius: 4px; 
                    padding: 20px; 
                    position: relative; 
                    transition: 0.3s ease;
                    backdrop-filter: blur(5px);
                `;
                
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px; margin-bottom: 15px;">
                        <div>
                            <div style="color: ${color}; font-family: 'Oswald'; font-size: 1.4rem; font-weight: bold; text-transform: uppercase; line-height: 1;">${s.nombre}</div>
                            <div style="font-size: 0.75rem; color: #666; margin-top: 4px; font-weight: bold;">${s.clase}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 0.65rem; color: #444; font-family: 'Roboto';">${s.fecha || 'Reciente'}</div>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                        <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; border-top: 2px solid ${color};">
                            <div style="font-size: 0.6rem; color: #555; text-transform: uppercase; font-weight: bold;">Rama Principal</div>
                            <div style="font-size: 0.9rem; color: #eee; font-family: 'Oswald';">${s.main_spec}</div>
                            <div style="font-size: 1rem; color: var(--accent-color); font-weight: bold; font-family: 'Oswald';">${s.main_gs} GS</div>
                        </div>
                        <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px; border-top: 2px solid #333;">
                            <div style="font-size: 0.6rem; color: #555; text-transform: uppercase; font-weight: bold;">Rama Dual</div>
                            <div style="font-size: 0.9rem; color: #eee; font-family: 'Oswald';">${s.dual_spec || 'N/A'}</div>
                            <div style="font-size: 1rem; color: #777; font-family: 'Oswald';">${s.dual_gs ? s.dual_gs + ' GS' : '--'}</div>
                        </div>
                    </div>

                    <div style="background: rgba(0,0,0,0.4); padding: 12px; border-radius: 4px; margin-bottom: 20px; min-height: 50px; border: 1px solid rgba(255,255,255,0.02);">
                        <div style="font-size: 0.6rem; color: #444; text-transform: uppercase; margin-bottom: 5px; font-weight: bold;">Mensaje del interesado:</div>
                        <div style="font-size: 0.85rem; color: #aaa; font-style: italic; line-height: 1.4; font-family: 'Roboto';">
                            "${s.mensaje || 'Sin mensaje adicional.'}"
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button onclick="gestionarSolicitud('${key}', 'aceptar', '${s.nombre}')" 
                            style="flex: 1.5; background: #28a745; border: none; color: #fff; padding: 12px; cursor: pointer; border-radius: 4px; font-family: 'Oswald'; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; transition: 0.2s;">
                            Aprobar Miembro
                        </button>
                        <button onclick="gestionarSolicitud('${key}', 'rechazar', '${s.nombre}')" 
                            style="flex: 1; background: transparent; border: 1px solid #dc3545; color: #dc3545; padding: 12px; cursor: pointer; border-radius: 4px; font-family: 'Oswald'; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; transition: 0.2s;">
                            Denegar
                        </button>
                    </div>
                `;

                // Efectos visuales de la tarjeta
                card.onmouseover = () => {
                    card.style.border = `1px solid ${color}66`;
                    card.style.boxShadow = `0 8px 25px rgba(0,0,0,0.5)`;
                };
                card.onmouseout = () => {
                    card.style.border = "1px solid rgba(255,255,255,0.05)";
                    card.style.boxShadow = "none";
                };

                container.appendChild(card);
            });
        });

        // Función para procesar la aprobación o denegación
        window.gestionarSolicitud = function(key, accion, nombre) {
            if(accion === 'aceptar') {
                if(confirm(`¿Deseas incorporar a ${nombre} a las filas de la hermandad?`)) {
                    // Aquí podrías añadir una función para mover los datos a una tabla de 'miembros_oficiales'
                    db.ref('solicitudes/' + key).remove()
                        .then(() => alert(`¡${nombre} ha sido aprobado!`));
                }
            } else {
                if(confirm(`¿Seguro que quieres denegar la solicitud de ${nombre}?`)) {
                    db.ref('solicitudes/' + key).remove()
                        .then(() => alert(`Solicitud denegada y eliminada.`));
                }
            }
        };
    })();
</script>
