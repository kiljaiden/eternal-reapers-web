<div class="module-header" style="margin-bottom: 30px;">
    <h2 style="font-family: 'Oswald'; color: var(--accent-color); margin-top: 0; text-transform: uppercase; letter-spacing: 2px;">Mi Perfil</h2>
    <p style="color: #666; font-size: 0.9rem;">Gestiona tu información personal y tus personajes de World of Warcraft.</p>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
    
    <div style="background: rgba(26, 29, 35, 0.8); border: 1px solid rgba(255,255,255,0.05); padding: 25px; border-radius: 4px;">
        <h3 style="font-family: 'Oswald'; color: #fff; margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px;">DATOS DE USUARIO</h3>
        
        <div style="margin-bottom: 15px;">
            <label style="display:block; font-size: 0.7rem; color: var(--accent-color); margin-bottom: 5px; font-weight: bold;">NOMBRE REAL / APODO</label>
            <input type="text" id="conf-name" style="width: 100%; background: #050505; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; font-size: 0.7rem; color: var(--accent-color); margin-bottom: 5px; font-weight: bold;">PERSONAJE PRINCIPAL</label>
            <input type="text" id="conf-pj" style="width: 100%; background: #050505; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; box-sizing: border-box;">
        </div>

        <button onclick="actualizarPerfil()" style="width: 100%; background: var(--accent-color); color: #000; border: none; padding: 12px; font-family: 'Oswald'; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 10px; text-transform: uppercase;">
            Guardar Cambios
        </button>
    </div>

    <div style="background: rgba(26, 29, 35, 0.8); border: 1px solid rgba(255,255,255,0.05); padding: 25px; border-radius: 4px;">
        <h3 style="font-family: 'Oswald'; color: #fff; margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px;">VINCULAR NUEVO PJ</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="pj-name" placeholder="Nombre del PJ" style="background: #050505; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px;">
            <select id="pj-class" style="background: #050505; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px;">
                <option value="Guerrero">Guerrero</option>
                <option value="Paladín">Paladín</option>
                <option value="Cazador">Cazador</option>
                <option value="Pícaro">Pícaro</option>
                <option value="Sacerdote">Sacerdote</option>
                <option value="Chamán">Chamán</option>
                <option value="Mago">Mago</option>
                <option value="Brujo">Brujo</option>
                <option value="Druida">Druida</option>
                <option value="Caballero de la Muerte">Caballero de la Muerte</option>
            </select>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
            <input type="text" id="pj-spec" placeholder="Especialización" style="background: #050505; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px;">
            <input type="number" id="pj-gs" placeholder="Puntuación de Equipo (GS)" style="background: #050505; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px;">
        </div>

        <button onclick="addPJ()" style="width: 100%; background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 10px; font-family: 'Oswald'; cursor: pointer; border-radius: 4px; text-transform: uppercase;">
            + Añadir Personaje
        </button>
    </div>

</div>

<div style="margin-top: 30px;">
    <h3 style="font-family: 'Oswald'; color: #555; font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 15px;">MIS PERSONAJES REGISTRADOS</h3>
    <div id="lista-pjs-config" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">
        </div>
</div>

<script>
    (function() {
        const userId = auth.currentUser.uid;
        const listContainer = document.getElementById('lista-pjs-config');

        // Función para cargar y mostrar personajes
        function loadPJs() {
            db.ref('usuarios/' + userId).on('value', s => {
                const d = s.val();
                if(!d) return;

                // Rellenar campos de perfil
                document.getElementById('conf-name').value = d.nombre || "";
                document.getElementById('conf-pj').value = d.personaje || "";

                // Rellenar lista de PJs
                listContainer.innerHTML = '';
                if(d.personajes) {
                    Object.entries(d.personajes).forEach(([key, p]) => {
                        const card = document.createElement('div');
                        card.style.cssText = "background: rgba(0,0,0,0.3); border: 1px solid #222; padding: 15px; border-radius: 4px; position: relative;";
                        card.innerHTML = `
                            <div style="font-family: 'Oswald'; color: #eee; font-size: 1rem;">${p.nombre}</div>
                            <div style="font-size: 0.75rem; color: #666; margin-bottom: 5px;">${p.clase} - ${p.spec}</div>
                            <div style="color: var(--accent-color); font-weight: bold; font-size: 0.85rem;">${p.gs} GS</div>
                            <button onclick="borrarPJ('${key}')" style="position: absolute; top: 10px; right: 10px; background: none; border: none; color: #444; cursor: pointer; font-size: 0.8rem;">&times;</button>
                        `;
                        listContainer.appendChild(card);
                    });
                } else {
                    listContainer.innerHTML = '<p style="color: #333; font-size: 0.8rem;">No hay personajes vinculados.</p>';
                }
            });
        }

        window.actualizarPerfil = function() {
            const nom = document.getElementById('conf-name').value;
            const pjM = document.getElementById('conf-pj').value;
            
            db.ref('usuarios/' + userId).update({
                nombre: nom,
                personaje: pjM
            }).then(() => alert("Perfil actualizado correctamente."));
        };

        window.addPJ = function() {
            const n = document.getElementById('pj-name').value;
            const c = document.getElementById('pj-class').value;
            const s = document.getElementById('pj-spec').value;
            const g = document.getElementById('pj-gs').value;

            if(!n || !g) return alert("Por favor, introduce al menos el nombre y el GS.");

            db.ref('usuarios/' + userId + '/personajes').push({
                nombre: n, clase: c, spec: s, gs: g
            }).then(() => {
                document.getElementById('pj-name').value = '';
                document.getElementById('pj-gs').value = '';
                document.getElementById('pj-spec').value = '';
            });
        };

        window.borrarPJ = function(key) {
            if(confirm("¿Seguro que quieres desvincular este personaje?")) {
                db.ref('usuarios/' + userId + '/personajes/' + key).remove();
            }
        };

        loadPJs();
    })();
</script>
