<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Reapers Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-darker: #070911;
            --bg-main: #0b0f19;
            --bg-panel: #121824;
            --accent: #00a8ff;
            --accent-glow: rgba(0, 168, 255, 0.3);
            --border: #222d3f;
            --text: #d1d5db;
            --text-muted: #6b7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-darker); color: var(--text); height: 100vh; overflow: hidden; }

        .app-container { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 1fr 70px; height: 100vh; }

        /* Panel de Perfil de Usuario */
        .user-profile-panel {
            display: flex; gap: 12px; align-items: center; background-color: rgba(255,255,255,0.02);
            padding: 12px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 15px;
        }
        .avatar-wrapper { position: relative; width: 40px; height: 40px; }
        .user-avatar { width: 100%; height: 100%; border-radius: 50%; border: 1px solid var(--accent); object-fit: cover; }
        .status-indicator { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-darker); }
        .status-indicator.online { background-color: #10b981; }
        .user-info { display: flex; flex-direction: column; }
        .user-name { font-weight: bold; color: white; font-size: 0.95rem; }
        .user-status { font-size: 0.8rem; color: var(--text-muted); }

        /* Sidebar Estilo Discord / Battle.net */
        .channels-sidebar { background-color: var(--bg-darker); border-right: 1px solid var(--border); padding: 15px; display: flex; flex-direction: column; }
        .guild-header h2 { font-size: 1.1rem; color: white; letter-spacing: 1px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }

        .category-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 10px 5px; }
        .category-title { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; letter-spacing: 0.5px; }
        #btn-create-room { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.9rem; outline: none; }

        .channel-item { padding: 10px; border-radius: 4px; cursor: pointer; margin-bottom: 8px; transition: background 0.2s; border-left: 3px solid transparent; }
        .channel-item:hover { background-color: rgba(255,255,255,0.05); color: white; }
        .channel-item.active { background-color: rgba(0, 168, 255, 0.1); border-left-color: var(--accent); color: var(--accent); }
        .user-badge-container { padding-left: 20px; margin-top: 5px; display: flex; flex-direction: column; gap: 4px; }
        .user-badge { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .user-badge i { color: #10b981; font-size: 0.5rem; }

        /* Contenido Principal */
        .main-content { background-color: var(--bg-main); display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { display: flex; justify-content: space-between; padding: 15px 20px; background-color: rgba(7, 9, 17, 0.5); border-bottom: 1px solid var(--border); }
        .room-info { font-weight: bold; color: white; }
        .window-controls span { margin-left: 15px; color: var(--text-muted); cursor: pointer; }

        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; overflow-y: auto; height: 100%; }
        .bnet-panel { background-color: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .panel-header { font-size: 0.85rem; color: var(--accent); font-weight: bold; letter-spacing: 1px; margin-bottom: 15px; }

        /* Reproductor e Indicadores */
        .now-playing-box { display: flex; gap: 15px; align-items: center; position: relative; }
        .audio-source-indicator { position: absolute; top: -5px; left: -5px; background-color: var(--accent); color: black; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 3px; }
        .cover-art { width: 90px; height: 90px; background-color: var(--bg-darker); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--accent); }
        .track-info h3 { font-size: 1.1rem; color: white; margin-bottom: 4px; }
        .track-info p { font-size: 0.9rem; color: var(--text-muted); }

        /* Buscador y Formulario */
        .search-box { display: flex; gap: 10px; margin-bottom: 10px; }
        .search-box input { flex-grow: 1; padding: 10px; background-color: var(--bg-darker); border: 1px solid var(--border); color: white; outline: none; border-radius: 4px; }
        .search-box input:focus { border-color: var(--accent); }
        .search-box button { padding: 0 15px; background: linear-gradient(to bottom, #0078d7, #005a9e); border: 1px solid var(--accent); color: white; cursor: pointer; border-radius: 4px; }
        
        .search-results-list { max-height: 150px; overflow-y: auto; background-color: var(--bg-darker); border-radius: 4px; margin-top: 5px; }
        .search-result-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        .search-result-item button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 1.1rem; outline: none; }

        .bnet-form input, .bnet-form select { width: 100%; padding: 10px; background-color: #070911; border: 1px solid #222d3f; color: white; outline: none; border-radius: 4px; }
        .bnet-form input:focus, .bnet-form select:focus { border-color: var(--accent); }
        .btn-primary { flex-grow: 1; padding: 10px; background: linear-gradient(to bottom, #0078d7, #005a9e); border: 1px solid var(--accent); color: white; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-primary:hover { background: linear-gradient(to bottom, #00a8ff, #0078d7); }

        /* Tablas de Cola */
        .table-scroll { overflow-y: auto; max-height: 400px; }
        .bnet-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        .bnet-table th { padding: 10px; border-bottom: 2px solid var(--border); color: var(--text-muted); font-weight: normal; }
        .bnet-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .bnet-table tr:hover { background-color: rgba(255,255,255,0.02); cursor: pointer; }
        .bnet-table tr.active-track { background-color: rgba(0, 168, 255, 0.05); color: var(--accent); border-left: 3px solid var(--accent); }
        .btn-delete-track { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: color 0.2s; font-size: 1rem; outline: none; }
        .btn-delete-track:hover { color: #ef4444; }

        /* Barra de Control Inferior */
        .player-bar { grid-column: 1 / 3; background-color: var(--bg-darker); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 30px; }
        .player-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; outline: none; }
        .player-btn:hover { color: white; }
        .main-play { color: var(--accent); font-size: 1.8rem; text-shadow: 0 0 10px var(--accent-glow); }
        .volume-group { display: flex; align-items: center; gap: 10px; color: var(--text-muted); }
        .volume-group input { accent-color: var(--accent); cursor: pointer; }

        /* Responsive Móvil */
        @media (max-width: 768px) {
            .app-container { grid-template-columns: 1fr; }
            .channels-sidebar { display: none; }
            .content-grid { grid-template-columns: 1fr; }
            .player-bar { grid-column: 1 / 2; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- COLUMNA 1: Canales estilo Discord -->
        <aside class="channels-sidebar">
            <!-- Sección Perfil de Usuario Battle.net -->
            <div class="user-profile-panel">
                <div class="avatar-wrapper">
                    <img src="https://i.pravatar.cc/150?img=61" alt="Avatar" class="user-avatar">
                    <div class="status-indicator online"></div>
                </div>
                <div class="user-info">
                    <div class="user-name">Jaiden</div>
                    <div class="user-status">En línea</div>
                </div>
            </div>

            <div class="guild-header">
                <h2><i class="fa-brands fa-battle-net"></i> ETERNAL REAPERS</h2>
            </div>
            
            <div class="category-header">
                <span class="category-title">CANALES DE AUDIO</span>
                <button id="btn-create-room" title="Crear nuevo canal"><i class="fa-solid fa-plus"></i></button>
            </div>

            <!-- Lista de Canales Dinámicos -->
            <div class="channels-list" id="rooms-container">
                <!-- Se inyectan por JavaScript -->
            </div>
        </aside>

        <!-- COLUMNA 2 y 3: Contenido Principal -->
        <main class="main-content">
            <header class="top-bar">
                <div class="room-info">Estás en: <span id="active-room-title">Sala de Raids ⚔️</span></div>
                <div class="window-controls"><span>—</span><span>□</span><span>✕</span></div>
            </header>

            <div class="content-grid">
                <!-- Izquierda: Buscador / Admin y Reproductor Actual -->
                <div class="panel-left">
                    <section class="bnet-panel current-panel">
                        <div class="now-playing-box">
                            <div class="audio-source-indicator" id="source-badge">YT</div>
                            <div class="cover-art"><i class="fa-solid fa-compact-disc fa-spin fa-3x"></i></div>
                            <div class="track-info">
                                <h3 id="track-title">Selecciona un tema</h3>
                                <p id="track-artist">Artista</p>
                            </div>
                        </div>
                    </section>

                    <!-- Panel de Gestión de Contenido Integrado -->
                    <section class="bnet-panel search-panel">
                        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>⚡ GESTIÓN DE CONTENIDO</span>
                            <button id="toggle-admin-view" style="background: none; border: none; color: #00a8ff; cursor: pointer; font-size: 0.8rem; font-weight: bold; outline: none;">
                                <i class="fa-solid fa-gear"></i> Modo Manual
                            </button>
                        </div>

                        <!-- VISTA A: Buscador Automático -->
                        <div id="wrapper-search-view">
                            <div class="search-box">
                                <input type="text" id="search-input" placeholder="Buscar en YouTube...">
                                <button id="btn-search"><i class="fa-solid fa-magnifying-glass"></i></button>
                            </div>
                            <div id="search-results" class="search-results-list"></div>
                        </div>

                        <!-- VISTA B: Panel de Administración Manual -->
                        <div id="wrapper-admin-view" style="display: none;">
                            <form id="song-form" class="bnet-form" style="display: flex; flex-direction: column; gap: 10px;">
                                <input type="text" id="admin-title" placeholder="Título de la canción" required>
                                <input type="text" id="admin-artist" placeholder="Artista u Orquesta" required>
                                <input type="text" id="admin-url" placeholder="URL completa o ID de YouTube / Enlace MP3" required>
                                <div style="display: flex; gap: 10px;">
                                    <select id="admin-type">
                                        <option value="youtube">YouTube Video</option>
                                        <option value="mp3">Archivo MP3 (Directo)</option>
                                    </select>
                                    <button type="submit" class="btn-primary">
                                        <i class="fa-solid fa-plus"></i> Inyectar a la Sala
                                    </button>
                                </div>
                            </form>
                        </div>
                    </section>
                </div>

                <!-- Derecha: Playlist del canal -->
                <div class="panel-right">
                    <section class="bnet-panel playlist-panel">
                        <div class="panel-header">📋 COLA DE LA SALA</div>
                        <div class="table-scroll">
                            <table class="bnet-table">
                                <thead>
                                    <tr><th>Tipo</th><th>Título</th><th>Artista</th><th style="text-align: right;">Gestionar</th></tr>
                                </thead>
                                <tbody id="playlist-body">
                                    <!-- Carga por JS -->
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <!-- BARRA INFERIOR: Reproductor Global -->
        <footer class="player-bar">
            <div class="controls-group">
                <button class="player-btn" id="btn-prev"><i class="fa-solid fa-backward-step"></i></button>
                <button class="player-btn main-play" id="btn-play"><i class="fa-solid fa-play"></i></button>
                <button class="player-btn" id="btn-next"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="volume-group">
                <i class="fa-solid fa-volume-low"></i>
                <input type="range" id="volume-range" min="0" max="100" value="50">
            </div>
        </footer>
    </div>

    <!-- Contenedor Oculto exigido por la API de YouTube -->
    <div id="youtube-audio-player" style="display:none;"></div>
    
    <!-- LÓGICA DE JAVASCRIPT UNIFICADA -->
    <script>
        let player;
        let isPlayerReady = false;
        const htmlAudioPlayer = new Audio();
        let currentMotor = 'none';
        let currentTrackIndex = 0;
        let currentRoom = 'raids';

        // Estructura Base de Datos inicial (Si no hay nada en el localStorage)
        const defaultRoomsData = {
            raids: {
                name: "Sala de Raids ⚔️",
                tracks: [
                    { type: 'youtube', id: '4n6WP9qHyRM', title: 'Invincible (WoW Theme)', artist: 'Russell Brower' },
                    { type: 'youtube', id: 'dQw4w9WgXcQ', title: 'Never Gonna Give You Up', artist: 'Rick Astley' }
                ]
            },
            chill: {
                name: "Taberna / Chill 🍺",
                tracks: [
                    { type: 'mp3', id: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', title: 'Demo Pista Local', artist: 'Suno AI' }
                ]
            }
        };

        // Cargar playlists guardadas del disco local
        let roomsData = JSON.parse(localStorage.getItem('eternal_reapers_playlist')) || defaultRoomsData;

        function saveToLocalStorage() {
            localStorage.setItem('eternal_reapers_playlist', JSON.stringify(roomsData));
        }

        // Renderizar los canales en la barra lateral y mover la presencia de Jaiden
        function renderRooms() {
            const container = document.getElementById('rooms-container');
            container.innerHTML = '';

            Object.keys(roomsData).forEach(roomId => {
                const room = roomsData[roomId];
                const div = document.createElement('div');
                div.className = `channel-item ${roomId === currentRoom ? 'active' : ''}`;
                div.setAttribute('data-room', roomId);

                let htmlContent = `<span><i class="fa-solid fa-volume-high"></i> ${room.name}</span>`;
                
                if (roomId === currentRoom) {
                    htmlContent += `
                        <div class="user-badge-container">
                            <span class="user-badge"><i class="fa-solid fa-circle"></i> Jaiden</span>
                        </div>
                    `;
                }

                div.innerHTML = htmlContent;
                div.onclick = () => switchRoom(roomId);
                container.appendChild(div);
            });
        }

        function switchRoom(roomId) {
            currentRoom = roomId;
            document.getElementById('active-room-title').innerText = roomsData[currentRoom].name;
            
            currentTrackIndex = 0;
            renderPlaylist();
            renderRooms();

            if (roomsData[currentRoom].tracks.length > 0) {
                loadTrack(0);
            } else {
                resetPlayerUI();
            }
        }

        // Renderizar tabla de canciones con botón eliminar operativo
        function renderPlaylist() {
            const tbody = document.getElementById('playlist-body');
            tbody.innerHTML = '';
            const currentTracks = roomsData[currentRoom].tracks;

            currentTracks.forEach((track, index) => {
                const tr = document.createElement('tr');
                if (index === currentTrackIndex) tr.classList.add('active-track');
                
                const icon = track.type === 'youtube' 
                    ? '<i class="fa-brands fa-youtube" style="color:#ff0000"></i>' 
                    : '<i class="fa-solid fa-file-audio" style="color:#00a8ff"></i>';
                
                tr.innerHTML = `
                    <td>${icon}</td>
                    <td>${track.title}</td>
                    <td>${track.artist}</td>
                    <td style="text-align: right;">
                        <button class="btn-delete-track" data-index="${index}"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;

                tr.onclick = (e) => {
                    if (e.target.closest('.btn-delete-track')) return;
                    loadTrack(index);
                };

                tbody.appendChild(tr);
            });

            document.querySelectorAll('.btn-delete-track').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const targetIndex = parseInt(btn.getAttribute('data-index'));
                    removeTrack(targetIndex);
                };
            });
        }

        function removeTrack(index) {
            const tracks = roomsData[currentRoom].tracks;
            tracks.splice(index, 1);

            saveToLocalStorage();

            if (index === currentTrackIndex) {
                currentTrackIndex = 0;
                if (tracks.length > 0) {
                    loadTrack(0);
                } else {
                    resetPlayerUI();
                }
            } else if (index < currentTrackIndex) {
                currentTrackIndex--;
            }
            renderPlaylist();
        }

        // Crear nuevas salas de audio dinámicas
        document.getElementById('btn-create-room').onclick = () => {
            const roomName = prompt("Introduce el nombre para tu nuevo canal de audio:");
            if (!roomName || !roomName.trim()) return;

            const id = 'custom_' + Date.now();
            roomsData[id] = { name: roomName.trim(), tracks: [] };

            saveToLocalStorage();
            renderRooms();
            switchRoom(id);
        };

        function resetPlayerUI() {
            if(isPlayerReady) player.pauseVideo();
            htmlAudioPlayer.pause();
            document.getElementById('track-title').innerText = "Selecciona un tema";
            document.getElementById('track-artist').innerText = "Artista";
            document.querySelector('#btn-play i').className = 'fa-solid fa-play';
        }

        // Inicializar la API de YouTube obligatoriamente de manera global
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-audio-player', {
                height: '0', width: '0',
                videoId: roomsData[currentRoom].tracks[0]?.id || '',
                events: {
                    'onReady': () => { isPlayerReady = true; },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const playIcon = document.querySelector('#btn-play i');
            if (event.data === YT.PlayerState.PLAYING) {
                playIcon.className = 'fa-solid fa-pause';
            } else {
                playIcon.className = 'fa-solid fa-play';
            }
            if (event.data === YT.PlayerState.ENDED) nextTrack();
        }

        // Motor Híbrido Avanzado
        function loadTrack(index) {
            const tracks = roomsData[currentRoom].tracks;
            if (!tracks || tracks.length === 0) return;

            currentTrackIndex = index;
            const track = tracks[index];

            if(isPlayerReady) player.pauseVideo();
            htmlAudioPlayer.pause();

            document.getElementById('track-title').innerText = track.title;
            document.getElementById('track-artist').innerText = track.artist;
            const badge = document.getElementById('source-badge');

            if (track.type === 'youtube') {
                currentMotor = 'youtube';
                badge.innerText = 'YT';
                badge.style.backgroundColor = '#ff0000';
                if (isPlayerReady) player.loadVideoById(track.id);
            } else {
                currentMotor = 'mp3';
                badge.innerText = 'MP3';
                badge.style.backgroundColor = '#00a8ff';
                htmlAudioPlayer.src = track.id;
                htmlAudioPlayer.play();
                document.querySelector('#btn-play i').className = 'fa-solid fa-pause';
            }
            renderPlaylist();
        }

        // Control de botón Maestro Play/Pausa
        document.getElementById('btn-play').addEventListener('click', () => {
            const playIcon = document.querySelector('#btn-play i');
            if (currentMotor === 'youtube' && isPlayerReady) {
                if (player.getPlayerState() === YT.PlayerState.PLAYING) { player.pauseVideo(); } else { player.playVideo(); }
            } else if (currentMotor === 'mp3') {
                if (htmlAudioPlayer.paused) { htmlAudioPlayer.play(); playIcon.className = 'fa-solid fa-pause'; } 
                else { htmlAudioPlayer.pause(); playIcon.className = 'fa-solid fa-play'; }
            }
        });

        function nextTrack() {
            let nextIdx = currentTrackIndex + 1;
            if (nextIdx >= roomsData[currentRoom].tracks.length) nextIdx = 0;
            loadTrack(nextIdx);
        }
        document.getElementById('btn-next').onclick = nextTrack;

        document.getElementById('btn-prev').onclick = () => {
            let prevIdx = currentTrackIndex - 1;
            if (prevIdx < 0) prevIdx = roomsData[currentRoom].tracks.length - 1;
            loadTrack(prevIdx);
        };

        document.getElementById('volume-range').addEventListener('input', (e) => {
            const val = e.target.value;
            if (isPlayerReady) player.setVolume(val);
            htmlAudioPlayer.volume = val / 100;
        });

        // Alternador de Paneles Manual vs Buscador
        document.getElementById('toggle-admin-view').addEventListener('click', (e) => {
            const searchView = document.getElementById('wrapper-search-view');
            const adminView = document.getElementById('wrapper-admin-view');
            const btn = e.currentTarget;

            if (adminView.style.display === 'none') {
                adminView.style.display = 'block';
                searchView.style.display = 'none';
                btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Modo Buscador';
            } else {
                adminView.style.display = 'none';
                searchView.style.display = 'block';
                btn.innerHTML = '<i class="fa-solid fa-gear"></i> Modo Manual';
            }
        });

       function parseYouTubeTarget(input) {
    // Reemplazar el subdominio de music por el estándar para engañar al validador de texto
    let cleanInput = input.replace("music.youtube.com", "youtube.com");
    
    // Extractor avanzado por expresiones regulares
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=||shorts\/)([^#\&\?]*).*/;
    const match = cleanInput.match(regExp);
    return (match && match[2].length === 11) ? match[2] : cleanInput;
}

        // Gestión de Inserción Manual de Canciones
        document.getElementById('song-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('admin-title').value.trim();
            const artist = document.getElementById('admin-artist').value.trim();
            const rawUrl = document.getElementById('admin-url').value.trim();
            let type = document.getElementById('admin-type').value;

            let finalId = rawUrl;
            if (type === 'youtube') {
                finalId = parseYouTubeTarget(rawUrl);
                if (finalId.length !== 11) { alert('⚠️ Enlace de YT inválido.'); return; }
            }

            roomsData[currentRoom].tracks.push({ type: type, id: finalId, title: title, artist: artist });
            
            saveToLocalStorage();
            renderPlaylist();
            
            if (roomsData[currentRoom].tracks.length === 1) loadTrack(0);
            document.getElementById('song-form').reset();
            alert(`🎵 ¡Añadida a la cola actual con éxito!`);
        });

        // Simulación del Buscador Automatizado
        document.getElementById('btn-search').addEventListener('click', () => {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            const container = document.getElementById('search-results');
            container.innerHTML = '';

            const mock = [
                { type: 'youtube', id: '4n6WP9qHyRM', title: `${query} (Video Track de Prueba)`, artist: 'YouTube Engine' },
                { type: 'mp3', id: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', title: `${query} (Audio Local Directo)`, artist: 'Cloud Storage' }
            ];

            mock.forEach(res => {
                const div = document.createElement('div');
                div.className = 'search-result-item';
                div.innerHTML = `<span><strong>[${res.type.toUpperCase()}]</strong> ${res.title}</span> <button><i class="fa-solid fa-square-plus"></i></button>`;
                div.querySelector('button').onclick = () => {
                    roomsData[currentRoom].tracks.push(res);
                    saveToLocalStorage();
                    renderPlaylist();
                    container.innerHTML = '';
                    document.getElementById('search-input').value = '';
                    alert('🎵 ¡Añadido desde el buscador!');
                };
                container.appendChild(div);
            });
        });

        // Arranque Inicial
        renderRooms();
        renderPlaylist();
    </script>
</body>
</html>
