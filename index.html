<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternal Reapers - Launcher</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body class="bnet-layout">

    <aside class="sidebar-games">
        <div class="game-icon active">ER</div>
        <div class="divider"></div>
        <a href="#noticias" class="nav-item">Noticias</a>
        <a href="#calendario" class="nav-item">Calendario</a>
        <a href="#apply" class="nav-item">Reclutar</a>
    </aside>

    <main class="main-content">
        <header class="content-header">
            <div class="header-info">
                <h1>ETERNAL REAPERS</h1>
                <p>Estado del Reino: <span class="status-online">En línea</span></p>
            </div>
            <button class="play-btn" onclick="document.getElementById('apply').scrollIntoView()">UNIRSE AHORA</button>
        </header>

        <section id="noticias" class="noticias-grid">
            </section>

        <section id="calendario" class="calendar-section">
            <h2>Próximas Incursiones</h2>
            <div id="calendar-container"></div>
        </section>
    </main>

    <aside class="sidebar-social">
        <div class="social-header">MIEMBROS DE ÉLITE</div>
        <div id="roster-list" class="roster-list">
            </div>
        <div class="discord-widget">
            </div>
        <div class="visitor-box">
            Visitas: <span id="visit-count">0</span>
        </div>
    </aside>

    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
