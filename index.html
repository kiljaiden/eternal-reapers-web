function getUser(id){return db.users.find(function(u){return u.id===id;});}
function currentUser(){return getUser(db.currentUser);}
function isOfficer(){var u=currentUser();return u&&(u.role==='officer'||u.role==='admin');}
function isAdmin(){var u=currentUser();return u&&u.role==='admin';}
function formatCountdown(ms){if(ms<=0)return'00:00:00';var h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function toast(msg,type){type=type||'info';var t=document.createElement('div');t.className='toast '+type;var ic={success:'fa-check-circle',error:'fa-times-circle',warning:'fa-exclamation-triangle',info:'fa-info-circle'};t.innerHTML='<div class="flex items-center gap-2"><i class="fa-solid '+ic[type]+'"></i><span class="text-sm">'+msg+'</span></div>';document.getElementById('toast-container').appendChild(t);setTimeout(function(){t.remove();},3500);}

function renderItemLink(name,aowowId,rarity){var q={epic:'q4',legendary:'q5',rare:'q3'}[rarity]||'q3';if(aowowId)return'<a href="https://wotlk.ultimowow.com?item='+aowowId+'" class="'+q+'" rel="item='+aowowId+'">['+name+']</a>';return'<span style="color:'+rarityClass(rarity)+';font-weight:600">['+name+']</span>';}
function parseColor(p){if(p>=99)return'parse-pink';if(p>=90)return'parse-orange';if(p>=75)return'parse-purple';if(p>=50)return'parse-blue';return'parse-gray';}
window._tabs={};window._editNeeds=false;window._bisClass=0;window._bankTab=null;window._calDate=null;window._forumCat='all';window._forumSearch='';window._dkpSearch='';
function getTab(m,d){return window._tabs[m]||d;}
function setTab(m,t){window._tabs[m]=t;render();}
function renderTabModule(module,tabs,cm){var vis=tabs.filter(function(t){return t.show!==false;});var act=getTab(module,vis.length>0?vis[0].id:'');var found=false;for(var i=0;i<vis.length;i++){if(vis[i].id===act){found=true;break;}}if(!found)act=vis.length>0?vis[0].id:'';var content=cm[act]?cm[act]():'';var bar='<div class="flex gap-1 border-b border-gray-700/50 mb-5 overflow-x-auto">';for(var i=0;i<vis.length;i++){bar+='<button onclick="setTab(\''+module+'\',\''+vis[i].id+'\')" class="px-4 py-2 text-sm whitespace-nowrap transition '+(vis[i].id===act?'tab-active text-white':'text-gray-400 hover:text-white')+'">'+vis[i].label+'</button>';}bar+='</div>';return'<div class="fade-in">'+bar+content+'</div>';}
function populateLoginSelect(){var s=document.getElementById('login-user');if(!s)return;if(!db.users||db.users.length===0){db.users=JSON.parse(JSON.stringify(DEFAULT_USERS));saveDB();}s.innerHTML=db.users.map(function(u){return'<option value="'+u.id+'">'+u.name+' ('+u.class+' - '+u.role+')</option>';}).join('');}
function login(){var id=parseInt(document.getElementById('login-user').value);if(!id)return toast('Selecciona','error');var u=getUser(id);if(!u)return toast('No encontrado','error');db.currentUser=id;saveDB();document.getElementById('login-screen').style.display='none';initApp();toast('¡Bienvenido, '+u.name+'!','success');}
function register(){var n=document.getElementById('new-char-name').value.trim();if(!n)return toast('Nombre','error');for(var i=0;i<db.users.length;i++){if(db.users[i].name.toLowerCase()===n.toLowerCase())return toast('Ya existe','error');}db.users.push({id:Date.now(),name:n,class:'Guerrero',spec:'DPS',role:'player',dkp:0,ec:50,gs:3000,joinedAt:new Date().toISOString().split('T')[0]});saveDB();toast(n+' creado con 50 EC','success');populateLoginSelect();}
function logout(){db.currentUser=null;saveDB();document.getElementById('login-screen').style.display='flex';populateLoginSelect();}
function updateHeader(){var u=currentUser();if(!u)return;document.getElementById('header-username').textContent=u.name;document.getElementById('header-role').textContent=u.role==='admin'?'👑 Guild Master':u.role==='officer'?'⭐ Oficial':'Jugador';document.getElementById('header-dkp').textContent=u.dkp.toLocaleString();document.getElementById('header-ec').textContent=u.ec.toLocaleString();document.getElementById('header-avatar').src='https://ui-avatars.com/api/?name='+encodeURIComponent(u.name)+'&background=00aeff&color=fff&size=40';document.getElementById('nav-dashboard-wrapper').style.display=isOfficer()?'block':'none';}
function addDKP(uid,amt,reason){var u=getUser(uid);if(!u)return;u.dkp+=amt;db.dkpHistory.push({id:Date.now()+Math.random(),userId:uid,amount:amt,reason:reason,date:new Date().toISOString().split('T')[0]});}
function addEC(uid,amt,reason){var u=getUser(uid);if(!u)return;u.ec+=amt;db.ecHistory.push({id:Date.now()+Math.random(),userId:uid,amount:amt,reason:reason,date:new Date().toISOString().split('T')[0]});}
var currentModule='inicio';
function showModule(id){if(id==='dashboard'&&!isOfficer()){toast('Acceso denegado','error');return;}currentModule=id;var btns=document.querySelectorAll('aside nav button');for(var i=0;i<btns.length;i++)btns[i].classList.remove('active-nav');var btn=document.getElementById('nav-'+id);if(btn)btn.classList.add('active-nav');render();}
function render(){try{var area=document.getElementById('content-area');if(!area)return;updateHeader();var map={inicio:renderInicio,loot:renderLoot,raids:renderRaids,calendar:renderCalendar,economy:renderEconomy,guild:renderGuild,community:renderCommunity,progress:renderProgress,dashboard:renderDashboard};var fn=map[currentModule]||renderInicio;area.innerHTML=fn();renderLivePanel();updateCountdowns();}catch(e){console.error('render:',e);}}

/* === ALL MODULE FUNCTIONS (Loot, Raids, Calendar, Economy, Guild, Community, Progress, Dashboard) === */

function isItemLive(rid,iid){for(var i=0;i<db.liveSessions.length;i++){var s=db.liveSessions[i];if(s.raidId===rid&&s.itemId===iid&&s.status!=='finished')return true;}return false;}
function animateDie(elId,val,cb){var el=document.getElementById(elId);if(!el){if(cb)cb(val);return;}el.classList.add('rolling');var t=0;var iv=setInterval(function(){el.textContent=Math.floor(Math.random()*100)+1;t++;if(t>=14){clearInterval(iv);el.textContent=val;el.classList.remove('rolling');el.classList.add('done');if(cb)cb(val);}},70);}
function startSoftreserveLive(rid,iid){if(isItemLive(rid,iid))return toast('Ya en vivo','warning');var r=db.raids.find(function(x){return x.id===rid;});var item=r.items.find(function(i){return i.id===iid;});if(item.reservations.length===0)return toast('Sin reservas','warning');db.liveSessions.push({id:Date.now(),type:'softreserve',raidId:rid,itemId:iid,itemName:item.name,rarity:item.rarity,boss:item.boss,candidates:item.reservations.map(function(x){return{userId:x.userId,roll:null};}),status:'waiting',winnerId:null,winScore:null});saveDB();toast('🎲 En vivo: ['+item.name+']','info');render();}
function startLootCouncilLive(rid,iid){if(isItemLive(rid,iid))return toast('Ya en vivo','warning');var r=db.raids.find(function(x){return x.id===rid;});var item=r.items.find(function(i){return i.id===iid;});if(item.reservations.length===0)return toast('Sin candidatos','warning');db.liveSessions.push({id:Date.now(),type:'lootcouncil',raidId:rid,itemId:iid,itemName:item.name,rarity:item.rarity,boss:item.boss,candidates:item.reservations.map(function(x){return{userId:x.userId,roll:null,bonus:Object.keys(x.votes||{}).length*10};}),status:'waiting',winnerId:null,winScore:null});saveDB();toast('🎲 Council en vivo','info');render();}
function createDKPLiveFromTab(){var name=document.getElementById('dka-name').value.trim();var boss=document.getElementById('dka-boss').value.trim();var min=parseInt(document.getElementById('dka-min').value)||50;var dur=parseInt(document.getElementById('dka-dur').value)||2;if(!name)return toast('Nombre','error');db.liveSessions.push({id:Date.now(),type:'dkp_auction',itemName:name,boss:boss||'Subasta',rarity:'epic',minBid:min,bids:[],endTime:Date.now()+dur*60000,status:'bidding',candidates:[],winnerId:null,winScore:null});saveDB();toast('🎲 Subasta iniciada','info');render();}
function closeLiveSession(sid){db.liveSessions=db.liveSessions.filter(function(s){return s.id!==sid;});saveDB();render();}
function placeLiveBid(sid){var s=null;for(var i=0;i<db.liveSessions.length;i++){if(db.liveSessions[i].id===sid){s=db.liveSessions[i];break;}}if(!s)return;var uid=parseInt(document.getElementById('bid-user-'+sid).value);var amt=parseInt(document.getElementById('bid-amt-'+sid).value);if(!amt||amt<s.minBid)return toast('Mínimo: '+s.minBid,'error');var u=getUser(uid);if(u.dkp<amt)return toast('DKP insuficiente','error');var found=false;for(var i=0;i<s.bids.length;i++){if(s.bids[i].userId===uid){if(amt>s.bids[i].amount)s.bids[i].amount=amt;else return toast('Puja mayor','warning');found=true;break;}}if(!found)s.bids.push({userId:uid,amount:amt});saveDB();toast(u.name+' pujó '+amt,'success');renderLivePanel();}
function closeDKPAuctionAndRoll(sid){var s=null;for(var i=0;i<db.liveSessions.length;i++){if(db.liveSessions[i].id===sid){s=db.liveSessions[i];break;}}if(!s)return;if(s.bids.length===0){toast('Sin pujas','warning');closeLiveSession(sid);return;}var sorted=s.bids.slice().sort(function(a,b){return b.amount-a.amount;});var top=[];var seen={};for(var i=0;i<sorted.length&&top.length<3;i++){if(!seen[sorted[i].userId]){seen[sorted[i].userId]=true;top.push({userId:sorted[i].userId,bid:sorted[i].amount,roll:null});}}s.candidates=top;s.status='rolling';saveDB();renderLivePanel();var idx=0;(function step(){if(idx>=top.length){finishDKPRoll(sid);return;}var c=top[idx];var v=Math.floor(Math.random()*100)+1;c.roll=v;animateDie('die-'+sid+'-'+idx,v,function(){db.diceLog.unshift({user:(getUser(c.userId)||{}).name||'?',roll:v,item:s.itemName,date:new Date().toLocaleTimeString()});saveDB();idx++;step();});})();}
function finishDKPRoll(sid){var s=null;for(var i=0;i<db.liveSessions.length;i++){if(db.liveSessions[i].id===sid){s=db.liveSessions[i];break;}}if(!s)return;var w=null,best=-1;for(var i=0;i<s.candidates.length;i++){if(s.candidates[i].roll>best){best=s.candidates[i].roll;w=s.candidates[i];}}s.winnerId=w.userId;s.winScore=best;s.status='finished';addDKP(w.userId,-w.bid,'Subasta: '+s.itemName);db.lootHistory.push({id:Date.now(),itemName:s.itemName,winnerId:w.userId,raid:'Subasta DKP',date:new Date().toISOString().split('T')[0],cost:w.bid,method:'Dados('+w.roll+')'});saveDB();renderLivePanel();render();toast('🏆 '+(getUser(w.userId)||{}).name+' ganó','success');}
function rollLiveDiceAll(sid){var s=null;for(var i=0;i<db.liveSessions.length;i++){if(db.liveSessions[i].id===sid){s=db.liveSessions[i];break;}}if(!s||s.status==='rolling')return;s.status='rolling';saveDB();renderLivePanel();var idx=0;(function step(){if(idx>=s.candidates.length){finishLiveRoll(sid);return;}var c=s.candidates[idx];var v=Math.floor(Math.random()*100)+1;c.roll=v;animateDie('die-'+sid+'-'+idx,v,function(){db.diceLog.unshift({user:(getUser(c.userId)||{}).name||'?',roll:v,item:s.itemName,date:new Date().toLocaleTimeString()});saveDB();idx++;step();});})();}
function finishLiveRoll(sid){var s=null;for(var i=0;i<db.liveSessions.length;i++){if(db.liveSessions[i].id===sid){s=db.liveSessions[i];break;}}if(!s)return;var w=null,best=-1;for(var i=0;i<s.candidates.length;i++){var sc=s.candidates[i].roll;if(s.type==='lootcouncil')sc=s.candidates[i].roll+(s.candidates[i].bonus||0);if(sc>best){best=sc;w=s.candidates[i];}}s.winnerId=w.userId;s.winScore=best;s.status='finished';if(s.type==='softreserve'){var item=getItem(s.raidId,s.itemId);if(item){item.status='awarded';item.winnerId=w.userId;db.lootHistory.push({id:Date.now(),itemName:item.name,winnerId:w.userId,raid:'ICC 25H',date:new Date().toISOString().split('T')[0],cost:0,method:'Dados('+w.roll+')'});}saveDB();renderLivePanel();render();toast('🏆 '+(getUser(w.userId)||{}).name+' ganó','success');}else{saveDB();renderLivePanel();render();if(s.type==='lootcouncil')toast('Sugerencia: '+(getUser(w.userId)||{}).name+' (score '+best+')','info');}}
function adjustCouncilBonus(sid,idx,d){var s=null;for(var i=0;i<db.liveSessions.length;i++){if(db.liveSessions[i].id===sid){s=db.liveSessions[i];break;}}if(!s)return;s.candidates[idx].bonus=Math.max(0,Math.min(50,(s.candidates[idx].bonus||0)+d));saveDB();renderLivePanel();}
function confirmCouncilWinner(sid){var s=null;for(var i=0;i<db.liveSessions.length;i++){if(db.liveSessions[i].id===sid){s=db.liveSessions[i];break;}}if(!s||!s.winnerId)return;var item=getItem(s.raidId,s.itemId);if(item){item.status='awarded';item.winnerId=s.winnerId;db.lootHistory.push({id:Date.now(),itemName:item.name,winnerId:s.winnerId,raid:'ICC 25H',date:new Date().toISOString().split('T')[0],cost:0,method:'Council('+s.winScore+')'});db.lootCouncilLog.push({id:Date.now(),itemName:item.name,winnerId:s.winnerId,decidedBy:currentUser().id,date:new Date().toISOString().split('T')[0],reason:'Decisión en vivo'});}saveDB();render();toast('Item otorgado','success');}
function openManualRoll(){openModal('🎲 Tirada Manual','<div class="space-y-3 text-center"><div class="die-box mx-auto" id="manual-die" style="width:80px;height:80px;font-size:32px">?</div><button onclick="doManualRoll()" class="w-full bg-bnet-blue text-white py-2 rounded font-semibold">Tirar (1-100)</button></div>');}
function doManualRoll(){var v=Math.floor(Math.random()*100)+1;animateDie('manual-die',v,function(){db.diceLog.unshift({user:currentUser().name,roll:v,item:'Manual',date:new Date().toLocaleTimeString()});saveDB();setTimeout(function(){closeModal();renderLivePanel();},600);});}
function renderLivePanel(){var p=document.getElementById('live-panel-content');if(!p)return;var ss=db.liveSessions;document.getElementById('live-count').textContent=ss.length;var dot=document.getElementById('loot-live-dot');if(dot)dot.style.display=ss.length>0?'block':'none';var h='';if(ss.length===0){h='<div class="text-center py-10"><i class="fa-solid fa-dice text-4xl text-gray-600 mb-3"></i><p class="text-gray-500 text-sm">Sin sesiones en vivo</p></div><div class="border-t border-gray-700/50 pt-4"><button onclick="openManualRoll()" class="w-full bg-gray-700/50 hover:bg-gray-600 text-white py-2 rounded-lg text-xs mb-2"><i class="fa-solid fa-dice mr-1"></i>Tirada Manual</button>'+(isOfficer()?'<button onclick="showModule(\'loot\');setTab(\'loot\',\'dkpauction\')" class="w-full bg-red-600/80 hover:bg-red-500 text-white py-2 rounded-lg text-xs"><i class="fa-solid fa-gavel mr-1"></i>Subasta DKP</button>':'')+'</div>';}else{for(var i=0;i<ss.length;i++){h+=renderLiveCard(ss[i]);}}h+=renderDiceLogHTML();p.innerHTML=h;}
function renderLiveCard(s){var tl={softreserve:'Softreserve',dkp_auction:'Subasta DKP',lootcouncil:'Loot Council'};var tc={softreserve:'#00aeff',dkp_auction:'#f59e0b',lootcouncil:'#a335ee'};var h='<div class="bg-bnet-card rounded-lg border border-gray-700/50 p-3 mb-3"><div class="flex items-center justify-between mb-1"><span class="badge" style="background:'+tc[s.type]+'20;color:'+tc[s.type]+';border:1px solid '+tc[s.type]+'40">'+tl[s.type]+'</span>'+(s.status==='finished'?'<span class="badge bg-green-900/50 text-green-300">✓</span>':'<span class="badge bg-red-900/50 text-red-300 flex items-center gap-1"><span class="live-dot" style="width:6px;height:6px"></span>LIVE</span>')+'</div><h3 class="font-bold text-sm truncate" style="color:'+rarityClass(s.rarity)+'">['+s.itemName+']</h3>';if(s.type==='dkp_auction'&&s.status==='bidding'){var sorted=s.bids.slice().sort(function(a,b){return b.amount-a.amount;});h+='<div class="mb-2"><div class="countdown text-xl font-bold text-red-400" data-end="'+s.endTime+'">'+formatCountdown(s.endTime-Date.now())+'</div></div>'+(isOfficer()?'<div class="flex gap-1 mb-2"><select id="bid-user-'+s.id+'" class="flex-1 bg-bnet-dark border border-gray-700 rounded px-1 py-1 text-white text-[10px]">'+db.users.map(function(u){return'<option value="'+u.id+'">'+u.name+'</option>';}).join('')+'</select><input type="number" id="bid-amt-'+s.id+'" placeholder="DKP" class="w-16 bg-bnet-dark border border-gray-700 rounded px-1 py-1 text-white text-[10px]"><button onclick="placeLiveBid('+s.id+')" class="bg-bnet-blue text-white px-2 py-1 rounded text-[10px]">Pujar</button></div><button onclick="closeDKPAuctionAndRoll('+s.id+')" class="w-full bg-red-600 text-white py-1.5 rounded text-[10px] font-semibold">Cerrar y Tirar</button>':'');}else if(s.candidates&&s.candidates.length>0){h+='<div class="space-y-1.5">';for(var i=0;i<s.candidates.length;i++){var c=s.candidates[i];var u=getUser(c.userId);var isW=s.status==='finished'&&c.userId===s.winnerId;var score=c.roll!==null?c.roll:'—';h+='<div class="flex items-center gap-2 bg-bnet-dark p-1.5 rounded '+(isW?'border border-yellow-600':'')+'"><div class="die-box '+(c.roll!==null?'done':'')+' '+(isW?'winner':'')+'" id="die-'+s.id+'-'+i+'" style="width:34px;height:34px;font-size:14px">'+(c.roll!==null?c.roll:'?')+'</div><div class="flex-1 min-w-0"><div class="font-semibold '+classColorClass((u||{}).class||'')+' text-xs truncate">'+((u||{}).name||'?')+' '+(isW?'👑':'')+'</div>'+(s.type==='lootcouncil'&&s.status==='waiting'?'<div class="flex items-center gap-1 mt-0.5"><button onclick="adjustCouncilBonus('+s.id+','+i+',-5)" class="bg-gray-700 text-white w-4 h-4 rounded text-[9px]">-</button><span class="text-[9px] text-yellow-400">+'+(c.bonus||0)+'</span><button onclick="adjustCouncilBonus('+s.id+','+i+',5)" class="bg-gray-700 text-white w-4 h-4 rounded text-[9px]">+</button></div>':'')+'</div><div class="text-right"><div class="font-bold '+(isW?'text-yellow-400':'text-white')+' text-xs">'+score+'</div></div></div>';}h+='</div>';if(s.status==='waiting'&&isOfficer())h+='<button onclick="rollLiveDiceAll('+s.id+')" class="w-full bg-bnet-blue text-white py-1.5 rounded text-[10px] font-semibold mt-2"><i class="fa-solid fa-dice mr-1"></i>Tirar ('+s.candidates.length+')</button>';if(s.status==='finished'){var w=getUser(s.winnerId);h+='<div class="mt-2 bg-yellow-900/20 border border-yellow-700 rounded p-2 text-center"><div class="text-yellow-400 font-bold text-xs">🏆 '+((w||{}).name||'?')+'</div>'+(s.type==='lootcouncil'&&isOfficer()?'<button onclick="confirmCouncilWinner('+s.id+')" class="mt-1 bg-green-600 text-white px-3 py-1 rounded text-[10px]">Confirmar</button>':'')+'</div>';}}h+='<button onclick="closeLiveSession('+s.id+')" class="w-full bg-gray-700/50 text-white py-1 rounded text-[10px] mt-2">Cerrar</button></div>';return h;}
function renderDiceLogHTML(){if(db.diceLog.length===0)return'';var h='<div class="border-t border-gray-700/50 pt-3 mt-2"><h4 class="text-[10px] font-bold text-gray-400 uppercase mb-2">Últimas Tiradas</h4><div class="space-y-1 max-h-40 overflow-y-auto">';for(var i=0;i<Math.min(12,db.diceLog.length);i++){var l=db.diceLog[i];h+='<div class="flex justify-between items-center bg-bnet-dark p-1.5 rounded text-[10px]"><span class="truncate">'+l.user+'</span><span class="font-bold '+(l.roll>=80?'text-green-400':'text-yellow-400')+'">'+l.roll+'</span></div>';}return h+'</div></div>';}

function renderDKP(){var search=(window._dkpSearch||'').toLowerCase();var sorted=db.users.slice().filter(function(u){return u.name.toLowerCase().indexOf(search)!==-1||u.class.toLowerCase().indexOf(search)!==-1;}).sort(function(a,b){return b.dkp-a.dkp;});var max=sorted.length>0?sorted[0].dkp:1;var h='<div class="space-y-6"><div class="flex justify-between items-center flex-wrap gap-2"><div><h2 class="text-2xl font-bold text-white">Ranking DKP</h2></div><div class="flex gap-2"><input type="text" placeholder="Buscar..." oninput="window._dkpSearch=this.value;render()" value="'+(window._dkpSearch||'')+'" class="bg-bnet-dark border border-gray-700 text-white px-3 py-2 rounded text-sm">'+(isOfficer()?'<button onclick="openGiveDKPModal()" class="bg-bnet-blue text-white px-4 py-2 rounded text-sm"><i class="fa-solid fa-plus mr-1"></i>Dar DKP</button>':'')+'</div></div><div class="bg-bnet-card rounded-lg border border-gray-700/50 overflow-hidden"><table class="w-full text-left"><thead class="bg-bnet-dark text-gray-400 text-xs uppercase"><tr><th class="p-3">#</th><th class="p-3">Jugador</th><th class="p-3">Clase</th><th class="p-3 w-32">Barra</th><th class="p-3 text-right">DKP</th></tr></thead><tbody class="divide-y divide-gray-700/50">';for(var i=0;i<sorted.length;i++){var u=sorted[i];h+='<tr class="hover-bnet"><td class="p-3 '+(i<3?'text-yellow-400':'text-gray-400')+' font-bold">'+(i+1)+'</td><td class="p-3 font-semibold text-white text-sm">'+u.name+'</td><td class="p-3 '+classColorClass(u.class)+' text-sm">'+u.class+'</td><td class="p-3"><div class="progress-bar"><div class="progress-fill" style="width:'+Math.max(5,u.dkp/max*100)+'%"></div></div></td><td class="p-3 text-right font-bold text-yellow-400">'+u.dkp.toLocaleString()+'</td></tr>';}return h+'</tbody></table></div></div>';}
function openGiveDKPModal(){openModal('Dar DKP','<div class="space-y-3"><select id="dkp-target" multiple class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white h-32">'+db.users.map(function(u){return'<option value="'+u.id+'">'+u.name+' ('+u.dkp+')</option>';}).join('')+'</select><input type="number" id="dkp-amount" placeholder="Cantidad" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><input type="text" id="dkp-reason" placeholder="Razón" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><button onclick="applyDKP()" class="w-full bg-bnet-blue text-white py-2 rounded">Aplicar</button></div>');}
function applyDKP(){var sel=document.getElementById('dkp-target');var ids=[];for(var i=0;i<sel.selectedOptions.length;i++)ids.push(parseInt(sel.selectedOptions[i].value));var amt=parseInt(document.getElementById('dkp-amount').value);var rea=document.getElementById('dkp-reason').value.trim();if(ids.length===0||isNaN(amt))return toast('Inválido','error');for(var i=0;i<ids.length;i++)addDKP(ids[i],amt,rea);saveDB();closeModal();toast('Aplicado','success');render();}
function renderECShopCombined(){var u=currentUser();var h='<div class="space-y-6"><div class="bg-gradient-to-r from-cyan-900/50 to-blue-900/50 p-5 rounded-xl border border-cyan-700/50 flex justify-between items-center"><div><h2 class="text-xl font-bold text-white">Tienda EC</h2></div><div class="text-right"><div class="text-2xl font-bold text-white"><i class="fa-solid fa-gem text-cyan-400 mr-1"></i>'+u.ec.toLocaleString()+'</div></div></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">';for(var i=0;i<db.shopItems.length;i++){var item=db.shopItems[i];var ok=u.ec>=item.price;h+='<div class="stat-card bg-bnet-card rounded-lg border border-gray-700/50 p-4"><div class="h-20 bg-bnet-dark rounded flex items-center justify-center mb-3"><i class="fa-solid '+item.icon+' text-3xl text-gray-500"></i></div><h4 class="font-semibold text-white text-sm">'+item.name+'</h4><div class="flex justify-between items-center mt-2"><span class="text-cyan-400 font-bold">'+item.price.toLocaleString()+'</span><button onclick="buyItem('+item.id+')" '+(ok?'':'disabled')+' class="'+(ok?'bg-bnet-blue':'bg-gray-700 cursor-not-allowed')+' text-white px-3 py-1 rounded text-xs">'+(ok?'Comprar':'Sin EC')+'</button></div></div>';}return h+'</div></div>';}
function buyItem(id){var item=null;for(var i=0;i<db.shopItems.length;i++){if(db.shopItems[i].id===id){item=db.shopItems[i];break;}}var u=currentUser();if(u.ec<item.price)return toast('EC insuficientes','error');if(!confirm('¿Comprar?'))return;addEC(u.id,-item.price,'Compra: '+item.name);saveDB();toast('¡Comprado!','success');render();}
function renderBlackmarket(){var h='<div class="space-y-6"><div class="flex justify-between items-center"><h2 class="text-2xl font-bold text-white">Blackmarket</h2><button onclick="openNewAuctionModal()" class="bg-bnet-blue text-white px-4 py-2 rounded text-sm"><i class="fa-solid fa-plus mr-2"></i>Subasta</button></div>';for(var i=0;i<db.auctions.length;i++){var a=db.auctions[i];var tb=a.bids.length>0?a.bids[a.bids.length-1]:null;var rem=a.endTime-Date.now();var min=tb?tb.amount+50:100;var exp=rem<=0;h+='<div class="stat-card bg-bnet-card rounded-lg border border-gray-700/50 p-5 relative '+(exp?'opacity-60':'')+'">'+(exp?'<span class="badge bg-gray-600 text-white absolute top-2 right-2">FINALIZADA</span>':'<span class="badge bg-red-600 text-white absolute top-2 right-2">EN VIVO</span>')+'<div class="flex gap-4"><div class="w-14 h-14 bg-bnet-dark rounded flex items-center justify-center"><i class="fa-solid '+(a.icon||'fa-gem')+' text-xl" style="color:'+rarityClass(a.rarity)+'"></i></div><div class="flex-1"><h3 class="font-bold" style="color:'+rarityClass(a.rarity)+'">['+a.itemName+']</h3><p class="text-xs text-gray-400">Vendedor: '+((getUser(a.sellerId)||{}).name||'?')+'</p><div class="text-lg font-bold text-yellow-400">'+(tb?tb.amount+' '+tb.currency.toUpperCase():'Sin pujas')+'</div>'+(!exp&&a.sellerId!==currentUser().id?'<div class="flex gap-1 mt-2"><button onclick="placeBid('+a.id+',\'dkp\','+min+')" class="bg-bnet-blue text-white px-2 py-1 rounded text-xs">DKP</button><button onclick="placeBid('+a.id+',\'ec\','+Math.ceil(min/10)+')" class="bg-cyan-600 text-white px-2 py-1 rounded text-xs">EC</button></div>':'')+'</div></div></div>';}return h+'</div>';}
function openNewAuctionModal(){openModal('Nueva Subasta','<div class="space-y-3"><input type="text" id="an-name" placeholder="Item" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><input type="number" id="an-hrs" placeholder="Horas" value="24" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><button onclick="createAuction()" class="w-full bg-bnet-blue text-white py-2 rounded">Publicar</button></div>');}
function createAuction(){var n=document.getElementById('an-name').value.trim();if(!n)return toast('Nombre','error');db.auctions.push({id:Date.now(),itemName:n,sellerId:currentUser().id,rarity:'epic',icon:'fa-gem',bids:[],endTime:Date.now()+parseInt(document.getElementById('an-hrs').value)*36e5,finished:false});saveDB();closeModal();toast('Creada','success');render();}
function placeBid(aId,cur,min){var amt=parseInt(prompt('Puja mín: '+min,min));if(!amt||amt<min)return toast('Mín: '+min,'error');var u=currentUser();if(cur==='dkp'&&u.dkp<amt)return toast('DKP insuficiente','error');if(cur==='ec'&&u.ec<amt)return toast('EC insuficiente','error');var a=null;for(var i=0;i<db.auctions.length;i++){if(db.auctions[i].id===aId){a=db.auctions[i];break;}}var prev=a.bids.length>0?a.bids[a.bids.length-1]:null;if(prev){var pu=getUser(prev.userId);if(prev.currency==='dkp')pu.dkp+=prev.amount;else pu.ec+=prev.amount;}if(cur==='dkp')u.dkp-=amt;else u.ec-=amt;a.bids.push({userId:u.id,amount:amt,currency:cur});saveDB();toast('Pujaste '+amt,'success');render();}

/* Guild, Community, Progress, Dashboard - using same structure */
function renderGuild(){var tabs=[{id:'members',label:'<i class="fa-solid fa-users mr-1"></i>Miembros'},{id:'recruitment',label:'<i class="fa-solid fa-user-plus mr-1"></i>Reclutamiento'},{id:'mentorship',label:'<i class="fa-solid fa-graduation-cap mr-1"></i>Mentoría'},{id:'bank',label:'<i class="fa-solid fa-warehouse mr-1"></i>Banco'},{id:'workshop',label:'<i class="fa-solid fa-hammer mr-1"></i>Workshop'},{id:'sanctions',label:'<i class="fa-solid fa-triangle-exclamation mr-1"></i>Sanciones'}];return renderTabModule('guild',tabs,{members:renderGuildMembers,recruitment:renderRecruitment,mentorship:renderMentorship,bank:renderBank,workshop:renderWorkshop,sanctions:renderSanctions});}
function renderGuildMembers(){var sorted=db.users.slice().sort(function(a,b){return(b.gs||0)-(a.gs||0);});var h='<div class="space-y-6"><div class="bg-bnet-card rounded-lg border border-gray-700/50 overflow-hidden"><table class="w-full text-left"><thead class="bg-bnet-dark text-gray-400 text-xs uppercase"><tr><th class="p-3">Miembro</th><th class="p-3">Clase</th><th class="p-3 text-right">GS</th><th class="p-3 text-right">DKP</th></tr></thead><tbody class="divide-y divide-gray-700/50">';for(var i=0;i<sorted.length;i++){var u=sorted[i];h+='<tr class="hover-bnet"><td class="p-3 font-semibold text-white text-sm">'+u.name+' '+(u.role==='admin'?'👑':u.role==='officer'?'⭐':'')+'</td><td class="p-3 '+classColorClass(u.class)+' text-xs">'+u.class+'</td><td class="p-3 text-right text-purple-400 font-bold text-sm">'+(u.gs||0).toLocaleString()+'</td><td class="p-3 text-right text-yellow-400 font-bold text-sm">'+u.dkp.toLocaleString()+'</td></tr>';}return h+'</tbody></table></div></div>';}
function renderRecruitment(){var applied=db.applications.filter(function(a){return a.stage==='applied';});var trial=db.applications.filter(function(a){return a.stage==='trial';});var h='<div class="space-y-6"><div class="grid grid-cols-1 lg:grid-cols-3 gap-4"><div class="bg-bnet-card rounded-lg border border-gray-700/50 p-4"><h3 class="font-bold text-white text-sm mb-3">📥 Aplicaciones ('+applied.length+')</h3>';for(var i=0;i<applied.length;i++){var a=applied[i];h+='<div class="bg-bnet-dark rounded p-3 border border-gray-700/50 mb-2"><h4 class="font-bold text-white text-sm">'+a.charName+'</h4><p class="text-xs '+classColorClass(a.class)+'">'+a.class+' '+a.spec+'</p><p class="text-xs text-gray-400 italic mt-1">"'+a.message+'"</p>'+(isOfficer()?'<div class="flex gap-1 mt-2"><button onclick="toTrial('+a.id+')" class="flex-1 bg-yellow-600 text-white py-1 rounded text-xs">Prueba</button><button onclick="rejectApp('+a.id+')" class="flex-1 bg-red-600 text-white py-1 rounded text-xs">✗</button></div>':'')+'</div>';}h+=(applied.length===0?'<p class="text-gray-500 text-xs">Sin aplicaciones</p>':'')+'</div><div class="bg-bnet-card rounded-lg border border-yellow-800/50 p-4"><h3 class="font-bold text-yellow-400 text-sm mb-3">⏳ En Prueba ('+trial.length+')</h3>';for(var i=0;i<trial.length;i++){var a=trial[i];h+='<div class="bg-bnet-dark rounded p-3 border border-yellow-800/30 mb-2"><h4 class="font-bold text-white text-sm">'+a.charName+'</h4>'+(isOfficer()?'<div class="flex gap-1 mt-2"><button onclick="approveApp('+a.id+')" class="flex-1 bg-green-600 text-white py-1 rounded text-xs">✓ Aprobar</button><button onclick="rejectApp('+a.id+')" class="flex-1 bg-red-600 text-white py-1 rounded text-xs">✗</button></div>':'')+'</div>';}h+=(trial.length===0?'<p class="text-gray-500 text-xs">Nadie</p>':'')+'</div></div><div class="bg-bnet-card p-6 rounded-lg border border-gray-700/50"><h3 class="font-bold text-white mb-4"><i class="fa-solid fa-user-plus mr-2 text-bnet-blue"></i>Aplicar</h3><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><input type="text" id="app-name" placeholder="Nombre" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm"><select id="app-class" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm">'+WOW_CLASSES.map(function(c){return'<option>'+c+'</option>';}).join('')+'</select><input type="text" id="app-spec" placeholder="Spec" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm"></div><textarea id="app-msg" rows="2" placeholder="Mensaje" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm mt-3"></textarea><button onclick="submitApplication()" class="mt-3 bg-bnet-blue text-white px-6 py-2 rounded text-sm">Enviar</button></div></div>';return h;}
function toTrial(id){var a=null;for(var i=0;i<db.applications.length;i++){if(db.applications[i].id===id){a=db.applications[i];break;}}a.stage='trial';a.trialEnd=new Date(Date.now()+14*864e5).toISOString().split('T')[0];saveDB();toast('En prueba','success');render();}
function approveApp(id){var a=null;for(var i=0;i<db.applications.length;i++){if(db.applications[i].id===id){a=db.applications[i];break;}}a.stage='approved';saveDB();toast('Aprobado','success');render();}
function rejectApp(id){var a=null;for(var i=0;i<db.applications.length;i++){if(db.applications[i].id===id){a=db.applications[i];break;}}a.stage='rejected';saveDB();toast('Rechazado','warning');render();}
function submitApplication(){var name=document.getElementById('app-name').value.trim();var cls=document.getElementById('app-class').value;var spec=document.getElementById('app-spec').value.trim();var msg=document.getElementById('app-msg').value.trim();if(!name||!spec||!msg)return toast('Completa','error');db.applications.push({id:Date.now(),charName:name,class:cls,spec:spec,gs:5000,availability:'',experience:'',message:msg,stage:'applied',votes:{},date:new Date().toISOString().split('T')[0]});saveDB();toast('Enviada','success');render();}
function getMentorLevel(pts){var lvl=MENTOR_LEVELS[0];for(var i=MENTOR_LEVELS.length-1;i>=0;i--){if(pts>=MENTOR_LEVELS[i].minPts){lvl=MENTOR_LEVELS[i];break;}}return lvl;}
function renderMentorship(){var h='<div class="space-y-6"><div class="grid grid-cols-1 md:grid-cols-2 gap-4">';for(var i=0;i<db.mentorships.length;i++){var m=db.mentorships[i];var mentor=getUser(m.mentorId);var mentee=getUser(m.menteeId);var lvl=getMentorLevel(m.points);h+='<div class="bg-bnet-card rounded-lg border border-gray-700/50 p-5"><div class="flex items-center gap-4 mb-4"><div class="text-center"><img src="https://ui-avatars.com/api/?name='+encodeURIComponent((mentor||{}).name||'?')+'&background=00aeff&color=fff&size=48" class="rounded-full"><p class="text-xs mt-1">'+((mentor||{}).name||'?')+'</p></div><i class="fa-solid fa-arrow-right text-gray-500"></i><div class="text-center"><img src="https://ui-avatars.com/api/?name='+encodeURIComponent((mentee||{}).name||'?')+'&background=ff8000&color=fff&size=48" class="rounded-full"><p class="text-xs mt-1">'+((mentee||{}).name||'?')+'</p></div><div class="ml-auto"><span class="badge" style="background:'+lvl.color+'20;color:'+lvl.color+'">'+lvl.name+'</span><div class="text-xs text-gray-400 mt-1">'+m.points+' pts</div></div></div>'+(m.goals&&m.goals.length>0?'<div class="mb-3"><h4 class="text-xs font-bold text-gray-400 mb-2">Objetivos</h4><div class="space-y-1">'+m.goals.map(function(g,gi){return'<div class="flex items-center gap-2 text-xs"><button onclick="toggleGoal('+i+','+gi+')" class="'+(g.done?'text-green-400':'text-gray-500')+'"><i class="fa-solid '+(g.done?'fa-check-circle':'fa-circle')+'"></i></button><span class="'+(g.done?'text-gray-500 line-through':'text-gray-300')+'">'+g.text+'</span></div>';}).join('')+'</div></div>':'')+'</div>';}h+='</div></div>';return h;}
function toggleGoal(mi,gi){var m=db.mentorships[mi];if(!m.goals[gi].done){m.goals[gi].done=true;m.points+=20;toast('+20 pts','success');}else{m.goals[gi].done=false;m.points=Math.max(0,m.points-20);}saveDB();render();}
function renderBank(){var tab=window._bankTab||db.bankTabs[0];var items=db.bankItems.filter(function(i){return i.tab===tab;});var h='<div class="space-y-6"><div class="flex gap-2 border-b border-gray-700/50 pb-2">'+db.bankTabs.map(function(t){return'<button onclick="window._bankTab=\''+t+'\';render()" class="px-4 py-2 text-sm '+(t===tab?'tab-active text-white':'text-gray-400')+'">'+t+'</button>';}).join('')+'</div><div class="grid grid-cols-2 md:grid-cols-4 gap-3">'+(items.length===0?'<p class="col-span-full text-gray-500 text-center py-8">Vacío</p>':items.map(function(i){return'<div class="stat-card bg-bnet-card p-4 rounded-lg border border-gray-700/50"><div class="h-14 bg-bnet-dark rounded mb-2 flex items-center justify-center"><i class="fa-solid fa-box text-xl text-gray-600"></i></div><h4 class="font-semibold text-white text-xs">'+i.name+'</h4><div class="text-xs text-gray-400 mt-1">x'+i.quantity+'</div></div>';}).join(''))+'</div></div>';return h;}
function renderWorkshop(){var h='<div class="space-y-6"><div class="grid grid-cols-1 md:grid-cols-2 gap-4">';for(var i=0;i<db.workshopOrders.length;i++){var o=db.workshopOrders[i];var req=getUser(o.requesterId);h+='<div class="stat-card bg-bnet-card rounded-lg border border-gray-700/50 p-5"><h3 class="font-bold text-white">['+o.itemName+']</h3><p class="text-sm text-gray-400">'+((req||{}).name||'?')+' • '+o.profession+'</p><div class="progress-bar mt-3"><div class="progress-fill '+(o.progress>=100?'green':'yellow')+'" style="width:'+o.progress+'%"></div></div><div class="text-xs text-gray-400 mt-2">'+o.progress+'%</div>'+(o.status!=='completed'?'<button onclick="updateOrderProgress('+o.id+')" class="mt-2 w-full bg-orange-600 text-white py-1.5 rounded text-xs">+25%</button>':'<span class="badge bg-green-900/50 text-green-300 mt-2">✓ Completado</span>')+'</div>';}h+='</div></div>';return h;}
function updateOrderProgress(id){var o=null;for(var i=0;i<db.workshopOrders.length;i++){if(db.workshopOrders[i].id===id){o=db.workshopOrders[i];break;}}o.progress=Math.min(100,o.progress+25);if(o.progress>=100)o.status='completed';saveDB();render();}
function renderSanctions(){var h='<div class="space-y-6"><div class="flex justify-between items-center"><h2 class="text-2xl font-bold text-white">Sanciones</h2>'+(isOfficer()?'<button onclick="openNewPunishmentModal()" class="bg-red-600 text-white px-4 py-2 rounded text-sm"><i class="fa-solid fa-plus mr-2"></i>Nueva</button>':'')+'</div><div class="bg-bnet-card rounded-lg border border-gray-700/50 overflow-hidden"><table class="w-full text-left"><thead class="bg-bnet-dark text-gray-400 text-xs uppercase"><tr><th class="p-3">Fecha</th><th class="p-3">Jugador</th><th class="p-3">Tipo</th><th class="p-3 text-right">Penal.</th></tr></thead><tbody class="divide-y divide-gray-700/50">';if(db.punishments.length===0){h+='<tr><td colspan="4" class="p-6 text-center text-gray-500">Sin sanciones</td></tr>';}else{for(var i=db.punishments.length-1;i>=0;i--){var p=db.punishments[i];var u=getUser(p.userId);h+='<tr class="hover-bnet"><td class="p-3 text-gray-400 text-xs">'+p.date+'</td><td class="p-3 font-semibold text-sm">'+((u||{}).name||'?')+'</td><td class="p-3"><span class="badge bg-red-900/50 text-red-300">'+p.type+'</span></td><td class="p-3 text-right text-red-400 font-bold">'+p.penalty+' DKP</td></tr>';}}return h+'</tbody></table></div></div>';}
function openNewPunishmentModal(){openModal('Sanción','<div class="space-y-3"><select id="p-user" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white">'+db.users.map(function(u){return'<option value="'+u.id+'">'+u.name+'</option>';}).join('')+'</select><select id="p-type" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><option>AFK en Raid</option><option>Llegada tarde</option><option>Ausencia</option></select><input type="number" id="p-pen" value="-25" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><input type="text" id="p-reason" placeholder="Razón" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><button onclick="applyPunishment()" class="w-full bg-red-600 text-white py-2 rounded">Aplicar</button></div>');}
function applyPunishment(){var uid=parseInt(document.getElementById('p-user').value);var type=document.getElementById('p-type').value;var pen=parseInt(document.getElementById('p-pen').value);var reason=document.getElementById('p-reason').value.trim();if(pen>=0)return toast('Negativo','error');addDKP(uid,pen,'Sanción: '+type);db.punishments.push({id:Date.now(),userId:uid,type:type,penalty:pen,reason:reason,date:new Date().toISOString().split('T')[0],issuedBy:currentUser().id});saveDB();closeModal();toast('Aplicada','success');render();}

/* Community */
function renderCommunity(){var tabs=[{id:'forum',label:'<i class="fa-solid fa-comments mr-1"></i>Miniforo'},{id:'announcements',label:'<i class="fa-solid fa-bullhorn mr-1"></i>Anuncios'}];return renderTabModule('comm',tabs,{forum:renderForum,announcements:renderCommunityAnnouncements});}
function renderForum(){var cat=window._forumCat||'all';var search=(window._forumSearch||'').toLowerCase();var filtered=db.forumPosts.filter(function(p){if(cat!=='all'&&p.category!==cat)return false;if(search&&p.title.toLowerCase().indexOf(search)===-1)return false;return true;}).sort(function(a,b){return(b.pinned?1:0)-(a.pinned?1:0);});var h='<div class="space-y-6"><div class="flex justify-between items-center flex-wrap gap-2"><div><h2 class="text-2xl font-bold text-white">Miniforo</h2></div><button onclick="openNewPostModal()" class="bg-bnet-blue text-white px-4 py-2 rounded text-sm"><i class="fa-solid fa-pen mr-2"></i>Nuevo Post</button></div><div class="flex gap-2 flex-wrap mb-2"><button onclick="window._forumCat=\'all\';render()" class="px-3 py-1.5 rounded text-xs '+(cat==='all'?'bg-bnet-blue text-white':'bg-gray-700/50 text-gray-300')+'">Todos</button>';for(var i=0;i<FORUM_CATEGORIES.length;i++){var c=FORUM_CATEGORIES[i];h+='<button onclick="window._forumCat=\''+c.id+'\';render()" class="px-3 py-1.5 rounded text-xs '+(cat===c.id?'bg-bnet-blue text-white':'bg-gray-700/50 text-gray-300')+'"><i class="fa-solid '+c.icon+' mr-1"></i>'+c.name+'</button>';}h+='</div><input type="text" placeholder="Buscar..." oninput="window._forumSearch=this.value;render()" value="'+(window._forumSearch||'')+'" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm mb-4"><div class="space-y-4">';if(filtered.length===0){h+='<p class="text-gray-500 text-center py-8">No hay posts</p>';}for(var i=0;i<filtered.length;i++){var p=filtered[i];var author=getUser(p.author);var catObj=null;for(var j=0;j<FORUM_CATEGORIES.length;j++){if(FORUM_CATEGORIES[j].id===p.category){catObj=FORUM_CATEGORIES[j];break;}}var isLiked=p.likes.indexOf(currentUser().id)!==-1;h+='<div class="forum-post bg-bnet-card rounded-lg border border-gray-700/50 p-5 '+(p.pinned?'pinned':'')+'"><div class="flex justify-between items-start mb-2"><div class="flex items-center gap-2">'+(p.pinned?'<i class="fa-solid fa-thumbtack text-yellow-400"></i>':'')+'<span class="badge" style="background:'+(catObj?catObj.color:'#6b7280')+'20;color:'+(catObj?catObj.color:'#6b7280')+'">'+(catObj?catObj.name:'General')+'</span></div><span class="text-xs text-gray-500">'+p.date+'</span></div><h3 class="font-bold text-white text-lg mb-2">'+p.title+'</h3><p class="text-sm text-gray-300 mb-3">'+p.content.substring(0,200)+(p.content.length>200?'...':'')+'</p><div class="flex flex-wrap gap-2 mb-3">'+(p.tags||[]).map(function(t){return'<span class="badge bg-gray-700 text-gray-300">#'+t+'</span>';}).join('')+'</div><div class="flex justify-between items-center"><div class="flex items-center gap-3"><button onclick="likePost('+p.id+')" class="'+(isLiked?'text-bnet-blue':'text-gray-400')+' text-sm"><i class="fa-solid fa-thumbs-up mr-1"></i>'+p.likes.length+'</button><button onclick="openPostComments('+p.id+')" class="text-gray-400 text-sm"><i class="fa-solid fa-comment mr-1"></i>'+(p.comments?p.comments.length:0)+'</button></div><span class="text-xs text-gray-500">por '+((author||{}).name||'?')+'</span></div></div>';}h+='</div></div>';return h;}
function likePost(id){var p=null;for(var i=0;i<db.forumPosts.length;i++){if(db.forumPosts[i].id===id){p=db.forumPosts[i];break;}}var idx=p.likes.indexOf(currentUser().id);if(idx!==-1)p.likes.splice(idx,1);else p.likes.push(currentUser().id);saveDB();render();}
function openPostComments(id){var p=null;for(var i=0;i<db.forumPosts.length;i++){if(db.forumPosts[i].id===id){p=db.forumPosts[i];break;}}var h='<div class="space-y-3"><h4 class="font-bold text-white">'+p.title+'</h4><p class="text-sm text-gray-300 mb-4">'+p.content+'</p><div class="space-y-2 max-h-48 overflow-y-auto">';if(p.comments){for(var i=0;i<p.comments.length;i++){var c=p.comments[i];var author=getUser(c.author);h+='<div class="bg-bnet-dark p-3 rounded"><p class="text-xs text-gray-300">'+c.text+'</p><p class="text-[10px] text-gray-500 mt-1">'+((author||{}).name||'?')+' • '+c.date+'</p></div>';}}h+='</div><div class="flex gap-2 mt-4"><input type="text" id="comment-text" placeholder="Comentario..." class="flex-1 bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm"><button onclick="addComment('+id+')" class="bg-bnet-blue text-white px-4 py-2 rounded text-sm">Enviar</button></div></div>';openModal('Comentarios',h);}
function addComment(postId){var text=document.getElementById('comment-text').value.trim();if(!text)return toast('Escribe algo','error');var p=null;for(var i=0;i<db.forumPosts.length;i++){if(db.forumPosts[i].id===postId){p=db.forumPosts[i];break;}}if(!p.comments)p.comments=[];p.comments.push({author:currentUser().id,text:text,date:new Date().toISOString().split('T')[0]});saveDB();closeModal();toast('Comentario agregado','success');render();}
function openNewPostModal(){openModal('Nuevo Post','<div class="space-y-3"><input type="text" id="post-title" placeholder="Título" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><select id="post-cat" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white">'+FORUM_CATEGORIES.map(function(c){return'<option value="'+c.id+'">'+c.name+'</option>';}).join('')+'</select><textarea id="post-content" rows="4" placeholder="Contenido..." class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"></textarea><button onclick="createPost()" class="w-full bg-bnet-blue text-white py-2 rounded">Publicar</button></div>');}
function createPost(){var title=document.getElementById('post-title').value.trim();var cat=document.getElementById('post-cat').value;var content=document.getElementById('post-content').value.trim();if(!title||!content)return toast('Completa','error');db.forumPosts.push({id:Date.now(),category:cat,title:title,author:currentUser().id,content:content,date:new Date().toISOString().split('T')[0],likes:[],comments:[],pinned:false,tags:[]});saveDB();closeModal();toast('Publicado','success');render();}
function renderCommunityAnnouncements(){var sorted=db.announcements.slice().sort(function(a,b){return(b.pinned?1:0)-(a.pinned?1:0);});var h='<div class="space-y-6"><div class="flex justify-between items-center"><h2 class="text-2xl font-bold text-white">Anuncios</h2>'+(isOfficer()?'<button onclick="openNewAnnouncementModal()" class="bg-bnet-blue text-white px-4 py-2 rounded text-sm">Nuevo</button>':'')+'</div>';for(var i=0;i<sorted.length;i++){var a=sorted[i];h+='<div class="bg-bnet-card rounded-lg border border-gray-700/50 p-5 '+(a.pinned?'pinned':'')+'"><h3 class="font-bold text-white mb-2">'+(a.pinned?'📌 ':'')+a.title+'</h3><p class="text-sm text-gray-300">'+a.body+'</p><p class="text-xs text-gray-500 mt-2">'+((getUser(a.author)||{}).name||'?')+' • '+a.date+'</p></div>';}return h+'</div>';}

/* Progress */
function renderProgress(){var tabs=[{id:'raidprogress',label:'<i class="fa-solid fa-dungeon mr-1"></i>Progresión'},{id:'parses',label:'<i class="fa-solid fa-chart-bar mr-1"></i>Parses'},{id:'pvp',label:'<i class="fa-solid fa-crosshairs mr-1"></i>PvP'},{id:'logros',label:'<i class="fa-solid fa-trophy mr-1"></i>Logros'},{id:'killlog',label:'<i class="fa-solid fa-skull mr-1"></i>Kill Log'}];return renderTabModule('progress',tabs,{raidprogress:renderRaidProgress,parses:renderParses,pvp:renderPvP,logros:renderLogros,killlog:renderKillLog});}
function renderRaidProgress(){var h='<div class="space-y-6"><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';for(var i=0;i<RAID_PROGRESSION.length;i++){var r=RAID_PROGRESSION[i];var pct=Math.round(r.killed/r.bosses*100);h+='<div class="stat-card bg-bnet-card rounded-lg border border-gray-700/50 p-5"><div class="flex justify-between items-center mb-2"><h3 class="font-bold text-white text-sm">'+r.name+'</h3><span class="text-xs" style="color:'+r.color+'">'+r.killed+'/'+r.bosses+'</span></div><div class="progress-bar mb-2"><div class="progress-fill" style="width:'+pct+'%;background:'+r.color+'"></div></div><div class="text-xs text-gray-400 text-center">'+(pct===100?'✓ CLEAN':'En progreso')+'</div></div>';}h+='</div><div class="bg-bnet-card rounded-lg border border-gray-700/50 p-5"><h3 class="font-bold text-white mb-3"><i class="fa-solid fa-medal text-yellow-400 mr-2"></i>Milestones</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3">';for(var i=0;i<GUILD_MILESTONES.length;i++){var m=GUILD_MILESTONES[i];h+='<div class="flex items-center gap-3 bg-bnet-dark p-3 rounded border border-gray-700/50"><div class="w-10 h-10 rounded-full flex items-center justify-center" style="background:'+m.color+'20;border:1px solid '+m.color+'40"><i class="fa-solid '+m.icon+'" style="color:'+m.color+'"></i></div><div><div class="text-white text-sm font-semibold">'+m.name+'</div><div class="text-xs text-gray-500">'+m.date+'</div></div></div>';}h+='</div></div></div>';return h;}
function renderParses(){var h='<div class="space-y-6"><div class="space-y-4">';for(var i=0;i<BOSS_PARSES.length;i++){var bp=BOSS_PARSES[i];h+='<div class="bg-bnet-card rounded-lg border border-gray-700/50 p-5"><h3 class="font-bold text-white mb-3">'+bp.boss+'</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><h4 class="text-xs font-bold text-red-400 uppercase mb-2">DPS</h4>';for(var j=0;j<bp.dps.length;j++){var d=bp.dps[j];h+='<div class="flex items-center justify-between bg-bnet-dark p-2 rounded mb-1"><span class="text-sm text-white">'+d.name+'</span><span class="font-bold '+parseColor(d.parse)+'">'+d.parse+'</span></div>';}h+='</div><div><h4 class="text-xs font-bold text-green-400 uppercase mb-2">HPS</h4>';for(var j=0;j<bp.hps.length;j++){var d=bp.hps[j];h+='<div class="flex items-center justify-between bg-bnet-dark p-2 rounded mb-1"><span class="text-sm text-white">'+d.name+'</span><span class="font-bold '+parseColor(d.parse)+'">'+d.parse+'</span></div>';}h+='</div></div></div>';}h+='</div></div>';return h;}
function renderPvP(){var sorted=db.pvpTeams.slice().sort(function(a,b){return b.rating-a.rating;});var h='<div class="space-y-6"><div class="grid grid-cols-1 md:grid-cols-3 gap-4">';for(var i=0;i<sorted.length;i++){var t=sorted[i];var wr=t.wins+t.losses>0?Math.round(t.wins/(t.wins+t.losses)*100):0;h+='<div class="stat-card bg-bnet-card rounded-lg border border-gray-700/50 p-5 '+(i===0?'border-yellow-700/50':'')+'"><div class="flex justify-between items-center mb-2"><span class="font-bold text-white">'+(i===0?'🏆 ':'')+t.name+'</span><span class="badge bg-gray-700 text-gray-300">'+t.type+'</span></div><div class="text-2xl font-bold '+(t.rating>=1800?'text-yellow-400':'text-white')+'">'+t.rating+'</div><div class="flex justify-between text-xs text-gray-400 mt-1"><span>'+t.wins+'W-'+t.losses+'L</span><span>'+wr+'%</span></div><div class="progress-bar mt-2"><div class="progress-fill" style="width:'+Math.min(100,t.rating/20)+'%"></div></div></div>';}return h+'</div></div>';}
function renderLogros(){var unlocked=db.achievements.filter(function(a){return a.unlocked;});var all=db.achievements;var h='<div class="space-y-6"><div class="progress-bar mb-4" style="height:12px"><div class="progress-fill green" style="width:'+(all.length>0?unlocked.length/all.length*100:0)+'%"></div></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">';for(var i=0;i<all.length;i++){var a=all[i];h+='<div class="stat-card bg-bnet-card rounded-lg border '+(a.unlocked?'border-green-700/50':'border-gray-700/50 opacity-50')+' p-5"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full flex items-center justify-center '+(a.unlocked?'bg-green-900/50':'bg-gray-800')+'"><i class="fa-solid '+a.icon+' '+(a.unlocked?'text-green-400':'text-gray-600')+'"></i></div><div><div class="text-white text-sm font-semibold">'+a.name+'</div><div class="text-xs text-gray-400">'+a.desc+'</div></div></div><div class="mt-3"><span class="badge '+(a.unlocked?'bg-green-900/50 text-green-300':'bg-gray-700 text-gray-400')+'">'+(a.unlocked?'✓':'+'+a.reward+' EC')+'</span></div></div>';}return h+'</div></div>';}
function renderKillLog(){var h='<div class="space-y-6"><div class="bg-bnet-card rounded-lg border border-gray-700/50 overflow-hidden"><table class="w-full text-left"><thead class="bg-bnet-dark text-gray-400 text-xs uppercase"><tr><th class="p-3">Boss</th><th class="p-3">Raid</th><th class="p-3">Dificultad</th><th class="p-3">Fecha</th><th class="p-3">Wipes</th></tr></thead><tbody class="divide-y divide-gray-700/50">';for(var i=0;i<BOSS_KILL_LOG.length;i++){var k=BOSS_KILL_LOG[i];h+='<tr class="hover-bnet"><td class="p-3 font-bold text-white text-sm">'+k.boss+'</td><td class="p-3 text-gray-300 text-sm">'+k.raid+'</td><td class="p-3"><span class="badge bg-red-900/50 text-red-300">'+k.difficulty+'</span></td><td class="p-3 text-gray-400 text-xs">'+k.date+'</td><td class="p-3 text-yellow-400 font-bold">'+k.wipes+'</td></tr>';}return h+'</tbody></table></div></div>';}

/* Dashboard Admin */
function renderDashboard(){if(!isOfficer())return'<p class="text-gray-400 text-center py-20">Acceso denegado</p>';var tabs=[{id:'users',label:'<i class="fa-solid fa-users mr-1"></i>Usuarios'},{id:'dkp',label:'<i class="fa-solid fa-dragon mr-1"></i>DKP'},{id:'ec',label:'<i class="fa-solid fa-gem mr-1"></i>EC'},{id:'raids',label:'<i class="fa-solid fa-dungeon mr-1"></i>Raids'},{id:'items',label:'<i class="fa-solid fa-database mr-1"></i>Items'},{id:'config',label:'<i class="fa-solid fa-gear mr-1"></i>Config'}];return renderTabModule('dashboard',tabs,{users:renderDashUsers,dkp:renderDashDKP,ec:renderDashEC,raids:renderDashRaids,items:renderDashItems,config:renderDashConfig});}
function renderDashUsers(){var h='<div class="space-y-6"><div class="bg-bnet-card rounded-lg border border-gray-700/50 overflow-hidden"><div class="p-4 border-b border-gray-700/50 flex justify-between items-center"><h3 class="font-bold text-white">Usuarios ('+db.users.length+')</h3><button onclick="openAddUserModal()" class="bg-bnet-blue text-white px-3 py-1.5 rounded text-xs"><i class="fa-solid fa-plus mr-1"></i>Usuario</button></div><table class="w-full text-left"><thead class="bg-bnet-dark text-gray-400 text-xs uppercase"><tr><th class="p-3">Nombre</th><th class="p-3">Clase</th><th class="p-3">Rol</th><th class="p-3 text-right">DKP</th><th class="p-3 text-right">EC</th></tr></thead><tbody class="divide-y divide-gray-700/50">';for(var i=0;i<db.users.length;i++){var u=db.users[i];h+='<tr class="hover-bnet"><td class="p-3 font-semibold text-white text-sm">'+u.name+'</td><td class="p-3 '+classColorClass(u.class)+' text-xs">'+u.class+'</td><td class="p-3"><select onchange="changeRole('+u.id+',this.value)" class="bg-bnet-dark border border-gray-700 rounded px-2 py-1 text-white text-xs" '+(isAdmin()?'':'disabled')+'><option value="player" '+(u.role==='player'?'selected':'')+'>Jugador</option><option value="officer" '+(u.role==='officer'?'selected':'')+'>Oficial</option>'+(isAdmin()?'<option value="admin" '+(u.role==='admin'?'selected':'')+'>Admin</option>':'')+'</select></td><td class="p-3 text-right text-yellow-400">'+u.dkp+'</td><td class="p-3 text-right text-cyan-400">'+u.ec+'</td></tr>';}return h+'</tbody></table></div></div>';}
function openAddUserModal(){openModal('Nuevo Usuario','<div class="space-y-3"><input type="text" id="nu-name" placeholder="Nombre" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><select id="nu-class" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white">'+WOW_CLASSES.map(function(c){return'<option>'+c+'</option>';}).join('')+'</select><button onclick="addUserFromDash()" class="w-full bg-bnet-blue text-white py-2 rounded">Crear</button></div>');}
function addUserFromDash(){var name=document.getElementById('nu-name').value.trim();var cls=document.getElementById('nu-class').value;if(!name)return toast('Nombre','error');db.users.push({id:Date.now(),name:name,class:cls,spec:'DPS',role:'player',dkp:0,ec:50,gs:3000,joinedAt:new Date().toISOString().split('T')[0]});saveDB();closeModal();toast('Creado','success');render();}
function changeRole(uid,role){var u=getUser(uid);u.role=role;saveDB();toast(u.name+' → '+role,'success');updateHeader();render();}
function renderDashDKP(){var h='<div class="space-y-6"><div class="bg-bnet-card p-6 rounded-lg border border-gray-700/50"><h3 class="font-bold text-white mb-4"><i class="fa-solid fa-dragon text-yellow-400 mr-2"></i>Gestión de DKP</h3><div class="space-y-3"><select id="dash-dkp-target" multiple class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white h-32">'+db.users.map(function(u){return'<option value="'+u.id+'">'+u.name+' ('+u.dkp+')</option>';}).join('')+'</select><div class="grid grid-cols-2 gap-3"><input type="number" id="dash-dkp-amt" placeholder="Cantidad" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><input type="text" id="dash-dkp-reason" placeholder="Razón" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"></div><button onclick="applyDashDKP()" class="w-full bg-bnet-blue text-white py-2 rounded font-semibold">Aplicar</button></div></div></div>';return h;}
function applyDashDKP(){var sel=document.getElementById('dash-dkp-target');var ids=[];for(var i=0;i<sel.selectedOptions.length;i++)ids.push(parseInt(sel.selectedOptions[i].value));var amt=parseInt(document.getElementById('dash-dkp-amt').value);var reason=document.getElementById('dash-dkp-reason').value.trim()||'Ajuste';if(ids.length===0||isNaN(amt))return toast('Inválido','error');for(var i=0;i<ids.length;i++)addDKP(ids[i],amt,reason);saveDB();toast('DKP aplicado','success');render();}
function renderDashEC(){var h='<div class="space-y-6"><div class="bg-bnet-card p-6 rounded-lg border border-gray-700/50"><h3 class="font-bold text-white mb-4"><i class="fa-solid fa-gem text-cyan-400 mr-2"></i>Gestión de EC</h3><div class="space-y-3"><select id="dash-ec-target" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white">'+db.users.map(function(u){return'<option value="'+u.id+'">'+u.name+' ('+u.ec+' EC)</option>';}).join('')+'</select><div class="grid grid-cols-2 gap-3"><input type="number" id="dash-ec-amt" placeholder="Cantidad" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"><input type="text" id="dash-ec-reason" placeholder="Razón" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white"></div><button onclick="applyDashEC()" class="w-full bg-cyan-600 text-white py-2 rounded font-semibold">Aplicar</button></div></div></div>';return h;}
function applyDashEC(){var uid=parseInt(document.getElementById('dash-ec-target').value);var amt=parseInt(document.getElementById('dash-ec-amt').value);var reason=document.getElementById('dash-ec-reason').value.trim()||'EC';if(isNaN(amt))return toast('Inválido','error');addEC(uid,amt,reason);saveDB();toast('EC aplicado','success');render();}
function renderDashRaids(){var h='<div class="space-y-6"><div class="flex justify-between items-center"><h3 class="font-bold text-white">Raids</h3><button onclick="openScheduleRaidModal()" class="bg-bnet-blue text-white px-4 py-2 rounded text-sm">+ Raid</button></div>';for(var i=0;i<db.raids.length;i++){var r=db.raids[i];h+='<div class="bg-bnet-card rounded-lg border border-gray-700/50 p-4 mb-3"><div class="flex justify-between items-center"><div><h4 class="font-bold text-white">'+r.name+'</h4><p class="text-xs text-gray-400">'+r.date+'</p></div><div class="flex gap-2">'+(r.reserveStatus!=='closed'?'<button onclick="closeReserves('+r.id+')" class="text-xs bg-red-600 text-white px-2 py-1 rounded">Cerrar</button>':'<button onclick="openReserves('+r.id+')" class="text-xs bg-green-600 text-white px-2 py-1 rounded">Abrir</button>')+'<button onclick="deleteRaidDash('+r.id+')" class="text-xs text-red-400"><i class="fa-solid fa-trash"></i></button></div></div></div>';}return h+'</div>';}
function deleteRaidDash(id){if(!confirm('¿Eliminar?'))return;db.raids=db.raids.filter(function(r){return r.id!==id;});saveDB();render();}
function renderDashItems(){var h='<div class="space-y-6"><div class="bg-bnet-card p-6 rounded-lg border border-gray-700/50"><h3 class="font-bold text-white mb-4"><i class="fa-solid fa-plus text-bnet-blue mr-2"></i>Agregar Item</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><input type="text" id="di-name" placeholder="Nombre" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm"><input type="number" id="di-aowow" placeholder="ID AoWoW" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm"><input type="text" id="di-type" placeholder="Tipo" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm"><select id="di-rarity" class="bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm"><option value="epic">Épico</option><option value="legendary">Legendario</option></select></div><button onclick="addItemToDB()" class="mt-4 bg-bnet-blue text-white px-6 py-2 rounded text-sm">Guardar</button></div><div class="bg-bnet-card rounded-lg border border-gray-700/50 overflow-hidden"><div class="p-4 border-b border-gray-700/50"><h3 class="font-bold text-white text-sm">Items ('+db.itemsDB.length+')</h3></div><table class="w-full text-left"><thead class="bg-bnet-dark text-gray-400 text-xs uppercase"><tr><th class="p-3">Item</th><th class="p-3">Tipo</th><th class="p-3">ID</th><th class="p-3 text-right">🗑️</th></tr></thead><tbody class="divide-y divide-gray-700/50">';for(var i=0;i<db.itemsDB.length;i++){var it=db.itemsDB[i];h+='<tr class="hover-bnet"><td class="p-3">'+renderItemLink(it.name,it.aowowId,it.rarity)+'</td><td class="p-3 text-gray-300 text-sm">'+it.type+'</td><td class="p-3 text-bnet-blue text-xs">'+it.aowowId+'</td><td class="p-3 text-right"><button onclick="deleteItemFromDB('+it.id+')" class="text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button></td></tr>';}return h+'</tbody></table></div></div>';}
function addItemToDB(){var name=document.getElementById('di-name').value.trim();var aowowId=parseInt(document.getElementById('di-aowow').value);var type=document.getElementById('di-type').value.trim();var rarity=document.getElementById('di-rarity').value;if(!name||!aowowId)return toast('Nombre e ID','error');var id=0;for(var i=0;i<db.itemsDB.length;i++){if(db.itemsDB[i].id>id)id=db.itemsDB[i].id;}db.itemsDB.push({id:id+1,aowowId:aowowId,name:name,type:type,rarity:rarity});saveDB();toast('Agregado','success');render();}
function deleteItemFromDB(id){if(!confirm('¿Eliminar?'))return;db.itemsDB=db.itemsDB.filter(function(i){return i.id!==id;});saveDB();render();}
function renderDashConfig(){return'<div class="space-y-6"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="bg-bnet-card p-5 rounded-lg border border-gray-700/50"><h4 class="font-bold text-white mb-3"><i class="fa-brands fa-discord text-indigo-400 mr-2"></i>Discord Webhook</h4><input type="url" id="dash-webhook" placeholder="URL..." value="'+db.discordWebhook+'" class="w-full bg-bnet-dark border border-gray-700 rounded px-3 py-2 text-white text-sm mb-2"><button onclick="saveDashWebhook()" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm w-full">Guardar</button></div><div class="bg-red-900/10 border border-red-800/50 rounded-lg p-5"><h4 class="font-bold text-red-300 mb-2">Zona Peligrosa</h4>'+(isAdmin()?'<button onclick="resetDB()" class="bg-red-900/50 text-red-300 px-4 py-2 rounded text-sm">Resetear DB</button>':'<p class="text-xs text-gray-500">Solo GM</p>')+'</div></div></div>';}
function saveDashWebhook(){db.discordWebhook=document.getElementById('dash-webhook').value.trim();saveDB();toast('Guardado','success');render();}

/* Init */
function updateCountdowns(){var els=document.querySelectorAll('.countdown');for(var i=0;i<els.length;i++){var end=parseInt(els[i].getAttribute('data-end'));if(end)els[i].textContent=formatCountdown(end-Date.now());}}
setInterval(updateCountdowns,1000);
setInterval(function(){for(var i=0;i<db.liveSessions.length;i++){var s=db.liveSessions[i];if(s.type==='dkp_auction'&&s.status==='bidding'&&s.endTime<=Date.now())closeDKPAuctionAndRoll(s.id);}},5000);
function initApp(){updateHeader();showModule('inicio');}
(function(){try{populateLoginSelect();if(db.currentUser){var u=getUser(db.currentUser);if(u){document.getElementById('login-screen').style.display='none';initApp();}else{db.currentUser=null;saveDB();}}}catch(e){console.error('Error init:',e);try{db.users=JSON.parse(JSON.stringify(DEFAULT_USERS));saveDB();populateLoginSelect();}catch(e2){}}})();
</script>
</body>
