<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --wow-gold: #c79c6e;
            --wow-dark: #0a0b0d;
            --wow-card: #15171e;
            --bnet-blue: #00aeff;
        }

        body { 
            background: #050505; color: #f0f0f0; font-family: 'Roboto', sans-serif; 
            margin: 0; padding: 20px; display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(circle, #1a1d23 0%, #050505 100%);
        }

        .apply-container { 
            background: var(--wow-card); padding: 40px; border-radius: 4px; border: 2px solid var(--wow-gold); 
            width: 100%; max-width: 650px; box-shadow: 0 0 40px rgba(0,0,0,0.9); position: relative;
        }

        h2 { font-family: 'Oswald'; color: var(--wow-gold); text-align: center; font-size: 2.2rem; text-transform: uppercase; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #888; font-style: italic; margin-bottom: 30px; display: block; }

        .form-group { margin-bottom: 20px; }
        label { display: block; color: var(--wow-gold); font-family: 'Oswald'; margin-bottom: 8px; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; }

        input, select, textarea { 
            width: 100%; padding: 12px; background: rgba(0,0,0,0.7); border: 1px solid #444; 
            color: white; border-radius: 4px; font-size: 1rem; transition: 0.3s;
        }

        input:focus, select:focus { border-color: var(--bnet-blue); outline: none; box-shadow: 0 0 10px rgba(0, 174, 255, 0.2); }

        /* SECCIONES DE SPEC */
        .spec-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 4px; border: 1px solid #222; }
        .spec-title { grid-column: span 2; color: var(--bnet-blue); font-family: 'Oswald'; font-size: 1rem; margin-bottom: 5px; border-bottom: 1px solid #333; }

        .btn-apply { 
            width: 100%; padding: 20px; background: linear-gradient(to bottom, #0074e0 0%, #00aeff 100%); 
            border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; 
            font-family: 'Oswald'; font-size: 1.5rem; text-transform: uppercase; margin-top: 20px;
        }

        .btn-apply:hover { filter: brightness(1.2); box-shadow: 0 0 20px rgba(0, 174, 255, 0.4); }

        #success { display: none; text-align: center; color: var(--bnet-blue); font-family: 'Oswald'; font-size: 1.8rem; padding: 40px; }
    </style>
</head>
<body>

    <div class="apply-container">
        <div id="form-content">
            <h2>Hoja de Reclutamiento</h2>
            <span class="subtitle">Eternal Reapers solicita tus servicios</span>
            
            <div class="form-group">
                <label>Nombre del Personaje</label>
                <input type="text" id="app-name" placeholder="Tu nombre en el juego...">
            </div>

            <div class="form-group">
                <label>Clase de Héroe</label>
                <select id="app-class" onchange="actualizarSpecs()">
                    <option value="">Selecciona tu clase...</option>
                    <option value="Guerrero">Guerrero</option>
                    <option value="Paladín">Paladín</option>
                    <option value="Cazador">Cazador</option>
                    <option value="Pícaro">Pícaro</option>
                    <option value="Sacerdote">Sacerdote</option>
                    <option value="DK">Caballero de la Muerte</option>
                    <option value="Chamán">Chamán</option>
                    <option value="Mago">Mago</option>
                    <option value="Brujo">Brujo</option>
                    <option value="Druida">Druida</option>
                </select>
            </div>

            <div class="form-group spec-grid">
                <div class="spec-title">ESPECIALIZACIÓN PRINCIPAL (Main Spec)</div>
                <div>
                    <label>Rama</label>
                    <select id="app-main-spec"><option>--</option></select>
                </div>
                <div>
                    <label>GS</label>
                    <input type="number" id="app-main-gs" step="0.1" placeholder="6.2">
                </div>
            </div>

            <div class="form-group spec-grid">
                <div class="spec-title">ESPECIALIZACIÓN DUAL (Off Spec)</div>
                <div>
                    <label>Rama</label>
                    <select id="app-dual-spec"><option>--</option></select>
                </div>
                <div>
                    <label>GS</label>
                    <input type="number" id="app-dual-gs" step="0.1" placeholder="5.8">
                </div>
            </div>

            <div class="form-group">
                <label>Experiencia / Comentarios</label>
                <textarea id="app-msg" rows="3" placeholder="Logros, profesiones, disponibilidad..."></textarea>
            </div>

            <button class="btn-apply" onclick="enviarSolicitud()">ENVIAR A LA COMANDANCIA</button>
        </div>

        <div id="success">
            ¡SOLICITUD REGISTRADA!<br>
            <span style="color: #888; font-size: 1rem;">Espera el llamado a las armas.</span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    <script>
        firebase.initializeApp({ databaseURL: "https://eternalreapersweb-default-rtdb.firebaseio.com" });
        const db = firebase.database();

        const ramas = {
            "Guerrero": ["Armas", "Furia", "Protección"],
            "Paladín": ["Sagrado", "Protección", "Reprensión"],
            "Cazador": ["Bestias", "Puntería", "Supervivencia"],
            "Pícaro": ["Asesinato", "Combate", "Sutileza"],
            "Sacerdote": ["Disciplina", "Sagrado", "Sombras"],
            "DK": ["Sangre", "Escarcha", "Profano"],
            "Chamán": ["Elemental", "Mejora", "Restauración"],
            "Mago": ["Arcano", "Fuego", "Escarcha"],
            "Brujo": ["Aflicción", "Demonología", "Destrucción"],
            "Druida": ["Equilibrio", "Feral (Dps)", "Feral (Tank)", "Restauración"]
        };

        function actualizarSpecs() {
            const clase = document.getElementById('app-class').value;
            const mainSelect = document.getElementById('app-main-spec');
            const dualSelect = document.getElementById('app-dual-spec');
            
            mainSelect.innerHTML = dualSelect.innerHTML = '<option value="N/A">Seleccionar...</option>';
            
            if(ramas[clase]) {
                ramas[clase].forEach(s => {
                    let opt = `<option value="${s}">${s}</option>`;
                    mainSelect.innerHTML += opt;
                    dualSelect.innerHTML += opt;
                });
            }
        }

        function enviarSolicitud() {
            const data = {
                nombre: document.getElementById('app-name').value,
                clase: document.getElementById('app-class').value,
                main_spec: document.getElementById('app-main-spec').value,
                main_gs: document.getElementById('app-main-gs').value,
                dual_spec: document.getElementById('app-dual-spec').value,
                dual_gs: document.getElementById('app-dual-gs').value,
                mensaje: document.getElementById('app-msg').value,
                fecha: new Date().toLocaleString()
            };

            if(!data.nombre || !data.clase || !data.main_gs) return alert("¡Por la Alianza! Rellena los datos mínimos.");

            db.ref('solicitudes').push(data).then(() => {
                document.getElementById('form-content').style.display = 'none';
                document.getElementById('success').style.display = 'block';
            });
        }
    </script>
</body>
</html>
