<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administrador - Eternal Reapers</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --accent-color: #00aeff;
            --bnet-sidebar: rgba(10, 11, 13, 0.95);
            --bnet-dark: #15171e;
            --bnet-text: #f0f0f0;
        }
        body { 
            margin: 0; padding: 0; background: #050505; 
            color: var(--bnet-text); font-family: 'Roboto', sans-serif; 
            display: flex; height: 100vh; overflow: hidden; 
            background-image: radial-gradient(circle at center, #15171e 0%, #050505 100%);
        }
        .sidebar-left { width: 240px; background: var(--bnet-sidebar); height: 100vh; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; backdrop-filter: blur(15px); z-index: 10; }
        .logo-box { padding: 30px; font-family: 'Oswald'; color: var(--accent-color); font-size: 1.4rem; text-align: center; font-weight: 700; text-transform: uppercase; }
        .nav-menu { flex-grow: 1; padding: 10px 0; overflow-y: auto; }
        .nav-item { padding: 12px 25px; color: #777; cursor: pointer; transition: 0.3s; display: flex; align-items: center; font-family: 'Oswald'; font-size: 0.9rem; text-transform: uppercase; }
        .nav-item:hover { background: rgba(0, 174, 255, 0.05); color: #fff; }
        .nav-item.active { color: var(--accent-color); border-left: 3px solid var(--accent-color); background: linear-gradient(90deg, rgba(0,174,255,0.1) 0%, transparent 100%); }
        .main-view { flex-grow: 1; display: flex; flex-direction: column; min-width: 600px; }
        .top-header { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2); }
        #module-container { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .sidebar-right { width: 260px; background: var(--bnet-sidebar); height: 100vh; border-left: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; backdrop-filter: blur(15px); }
        .social-header { padding: 20px; font-family: 'Oswald'; font-size: 0.9rem; color: #555; border-bottom: 1px solid rgba(255,255,255,0.05); text-transform: uppercase; }
        #friends-list { flex-grow: 1; padding: 15px; overflow-y: auto; }
        .user-online { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .user-online .dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .user-online .name { font-size: 0.85rem; color: #ddd; font-weight: bold; font-family: 'Oswald'; }
        .bnet-btn-main { background: var(--accent-color); color: #000; border: none; padding: 10px 25px; font-family: 'Oswald'; font-weight: 700; font-size: 1rem; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="sidebar-left">
        <div class="logo-box">Administrador</div>
        <nav class="nav-menu">
            <div class="nav-item active" onclick="loadModule('admin_usuarios.html', this)">Actualizar usuarios</div>
            <div class="nav-item" onclick="loadModule('oficial_solicitudes.html', this)">Aprobar nuevos</div>
            <div class="nav-item" onclick="loadModule('admin_noticias.html', this)">Crear Noticia</div>
            <div class="nav-item" onclick="loadModule('admin_reglas.html', this)">Crear Regla de hermandad</div>
            <div class="nav-item" onclick="loadModule('oficial_raids.html', this)">Crear calendario de Raids</div>
            <div class="nav-item" onclick="loadModule('oficial_personajes.html', this)">Miembros</div>
            <div class="nav-item" onclick="loadModule('admin_logs.html', this)">Registros</div>
            <div class="nav-item" onclick="loadModule('config.html', this)">Mi Perfil</div>
        </nav>
    </div>
    <div class="main-view">
        <div class="top-header">
            <div id="top-username" style="font-family:'Oswald'; color:#fff; letter-spacing: 1px;">SISTEMA CENTRAL</div>
            <button class="bnet-btn-main" onclick="location.href='index.html'">REGRESAR</button>
        </div>
        <div id="module-container"></div>
    </div>
    <div class="sidebar-right">
        <div class="social-header">Miembros Online</div>
        <div id="friends-list"></div>
    </div>

    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyDGELmVvBZZywbJOf6kuVKQJjKaRt6Q9ws",
  authDomain: "eternalreapersweb.firebaseapp.com",
  databaseURL: "https://eternalreapersweb-default-rtdb.firebaseio.com",
  projectId: "eternalreapersweb",
  storageBucket: "eternalreapersweb.firebasestorage.app",
  messagingSenderId: "945508907683",
  appId: "1:945508907683:web:b26cc3660298d4d6ba1d16",
  measurementId: "G-7J20NR0JDM"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        function loadModule(file, element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(element) element.classList.add('active');
            fetch(`modules/${file}`).then(res => res.text()).then(html => {
                const container = document.getElementById('module-container');
                container.innerHTML = html;
                const scripts = container.querySelectorAll("script");
                scripts.forEach(s => {
                    const newS = document.createElement("script");
                    newS.text = s.text;
                    document.body.appendChild(newS).parentNode.removeChild(newS);
                });
            });
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('usuarios/' + user.uid + '/estado').set('online');
                db.ref('usuarios/' + user.uid + '/estado').onDisconnect().set('offline');
                db.ref('usuarios/' + user.uid).once('value', s => {
                    const u = s.val();
                    if(u && u.rango === 'admin') {
                        document.getElementById('top-username').innerText = u.nombre.toUpperCase();
                        loadModule('admin_usuarios.html', document.querySelector('.nav-item.active'));
                    } else { window.location.href = 'index.html'; }
                });
                db.ref('usuarios').on('value', snap => {
                    const list = document.getElementById('friends-list');
                    list.innerHTML = '';
                    snap.forEach(c => {
                        const u = c.val();
                        if(u.estado === 'online') {
                            list.innerHTML += `<div class="user-online"><div class="dot"></div><div><div class="name">${u.nombre}</div><div style="font-size:0.7rem;color:#555">${u.rango}</div></div></div>`;
                        }
                    });
                });
            } else { window.location.href = 'index.html'; }
        });
    </script>
</body>
</html>
